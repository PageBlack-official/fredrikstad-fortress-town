:root{--bg:#e2e1d6;--ink:#2b2420;--paper:#f6f3ea;--muted:#7a7166}

html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}

// ---- lys: sola ----
// Plakatsolen (standard): sola står øverst til venstre i bildet uansett hvordan byen snus, som i trykkfila.

sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.25; sun.shadow.radius=4; sun.shadow.blurSamples=12;
const LYS = new THREE.Vector3(-0.66, 0.52, 0.54).normalize(); // lyset penselmatcapen til trærne er tegnet med (kamerarommet)
// plakatsolen i kamerarommet: fra venstre og litt over, så venstre fasader og tak er lyse, høyre fasader i skygge (som trykket),
// og kastskyggene faller mot høyre i bildet der de synes, ikke bak husene
const PLAKAT = new THREE.Vector3(-0.75, 0.65, 0.10).normalize();
const GRAD=Math.PI/180;
// solposisjon (samme formler som SunCalc): asimut fra nord med klokka og høyde over horisonten, i radianer
function solposisjon(dato, lat=59.2075, lon=10.9545){
  const dager=dato.valueOf()/864e5-0.5+2440588-2451545;
  const M=GRAD*(357.5291+0.98560028*dager);
  const C=GRAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const L=M+C+GRAD*102.9372+Math.PI, e=GRAD*23.4397;
  const dek=Math.asin(Math.sin(e)*Math.sin(L)), ra=Math.atan2(Math.sin(L)*Math.cos(e),Math.cos(L));
  const phi=GRAD*lat, H=GRAD*(280.16+360.9856235*dager)+GRAD*lon-ra;
  const hoyde=Math.asin(Math.sin(phi)*Math.sin(dek)+Math.cos(phi)*Math.cos(dek)*Math.cos(H));
  const azSor=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dek)*Math.cos(phi));
  return {asimut:azSor+Math.PI, hoyde};
}
const SOL={modus:'plakat', asimut:0, hoyde:35*GRAD};
// sollyset blir varmere jo lavere sola står
function solFargeFor(hoyde){ const k=THREE.MathUtils.smoothstep(hoyde,4*GRAD,34*GRAD);
  sun.color.setRGB(1.0, THREE.MathUtils.lerp(0.80,0.985,k), THREE.MathUtils.lerp(0.62,0.95,k)); }
function setSol(asimut, hoyde){
  SOL.modus='ekte'; SOL.asimut=asimut; SOL.hoyde=Math.max(hoyde,3*GRAD);
  solFargeFor(SOL.hoyde); skyggeSkitten=true;
}
function plakatSol(){
  SOL.modus='plakat';
  if(sun.parent!==scene){ sun.parent&&sun.parent.remove(sun); sun.target.parent&&sun.target.parent.remove(sun.target); scene.add(sun); scene.add(sun.target); }
  solFargeFor(35*GRAD); skyggeSkitten=true;
}

  for(const navn of ['position','normal']){ const a=geo.getAttribute(navn); ut.setAttribute(navn, new THREE.BufferAttribute(a.array.slice(start*a.itemSize,(start+n)*a.itemSize), a.itemSize)); }
  ekstra.forEach(navn=>{ const a=geo.getAttribute(navn); ut.setAttribute(navn, new THREE.BufferAttribute(a ? a.array.slice(start,start+n) : new Float32Array(n), 1)); });
  return ut;
}
function biterAv(mesh, matrise, ekstra){   // [materiale, geometri] per materialgruppe, i gitt koordinatsystem
  let geo=mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry;
  if(!geo.getAttribute('normal')) geo.computeVertexNormals();
  const n=geo.getAttribute('position').count;
  const grupper = Array.isArray(mesh.material) && geo.groups.length ? geo.groups.map(g=>[mesh.material[g.materialIndex], g.start, Math.min(g.count, n-g.start)]) : [[Array.isArray(mesh.material)?mesh.material[0]:mesh.material, 0, n]];
  return grupper.map(([m,start,antall])=>[m, bitAv(geo,start,antall,ekstra).applyMatrix4(matrise)]);
}
function flatGruppe(grp, ekstra=['aBygg','aTopp']){
  const samling=new Map(), vekk=[];
  (function gaa(o, forelder){ o.children.forEach(c=>{ c.updateMatrix(); const m=_mFlat.multiplyMatrices(forelder, c.matrix).clone();
    if(c.isLine){ vekk.push(c); return; }
    if(c.isMesh && !c.isInstancedMesh && c.geometry){ biterAv(c, m, ekstra).forEach(([mt,g])=>{ if(!samling.has(mt)) samling.set(mt,{biter:[], cs:false, rs:false}); const s=samling.get(mt); s.biter.push(g); s.cs=s.cs||c.castShadow; s.rs=s.rs||c.receiveShadow; }); vekk.push(c); }
    gaa(c, m); }); })(grp, new THREE.Matrix4());
  vekk.forEach(o=>o.removeFromParent());
  samling.forEach((s,mt)=>{ const geo=mergeGeometries(s.biter,false); if(!geo) return; s.biter.forEach(b=>b.dispose()); const mesh=new THREE.Mesh(geo,mt); mesh.castShadow=s.cs; mesh.receiveShadow=s.rs; mesh.customDepthMaterial=husDybde; grp.add(mesh); });
  grp.children.filter(c=>c.isGroup && !c.children.length).forEach(c=>c.removeFromParent());
  return grp;
}
// to toner som i tegningen: flater som vender mot sola (alltid øverst til venstre i bildet) får full farge, resten skyggetonen
function mat(rgb, dim, sk, opt={}){
  const key = rgb.join(',')+(dim?'d':'')+(sk?'s'+sk.join(','):'')+(opt.ds?'D':'');
  if(!mats.has(key)){
    const c=new THREE.Color(`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`); if(dim) c.lerp(new THREE.Color(0xe4e2d8),.8);
    // skyggetonen hentes fra trykkfila når bygget har en; ellers samme forhold som tegningen bruker
    let s; if(sk && !dim){ s=new THREE.Color(`rgb(${sk[0]},${sk[1]},${sk[2]})`); } else { s=c.clone(); s.r*=0.72; s.g*=0.80; s.b*=0.80; }
    const m=new THREE.ShaderMaterial({
      lights:true,
      uniforms:Object.assign({ farge:{value:c}, skygge:{value:s}, tHus:U_HUS, uVask:{value:STIL.vask}, skravur:U_SKRAVUR }, THREE.UniformsUtils.clone(THREE.UniformsLib.lights)),
      vertexShader:GL_SOL_V+GL_HUS_V+`varying vec3 vp; varying vec3 lp; varying vec3 wq; varying float topp; void main(){ topp=aTopp; vec3 pos=husPos(position); lp=pos; vec4 wp=modelMatrix*vec4(pos,1.); wq=wp.xyz; vec4 mv=viewMatrix*wp; vp=mv.xyz; gl_Position=projectionMatrix*mv;
        vec3 wn=normalize(mat3(modelMatrix)*normal+vec3(0.,1e-5,0.));`+glSolVMain('wp','wn')+`}`,
      fragmentShader:GL_SOL_F+`uniform mat3 normalMatrix; uniform vec3 farge, skygge; uniform float uVask; varying float topp; varying vec3 vp; varying vec3 lp; varying vec3 wq;
        float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
        float nn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hh(i),hh(i+vec2(1,0)),f.x),mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),f.x),f.y);}
        void main(){ vec3 n=normalize(normalMatrix*cross(dFdx(lp),dFdy(lp))); float d=dot(n,solRetning()); // normal fra lokale koordinater: presist, ingen stripete skygge
          // tegningens to toner (lys- og skyggetonen fra trykkfila) blandes av ekte lys: Lambert mot sola og kastskygger, myk overgang
          float lam=smoothstep(-0.12,0.52,d);
          float lit=lam*skyggeMask();
          float k=1.-lit;
          vec3 c = mix(skygge*KALD, farge*mix(vec3(1.),solFarge(),0.6), lit);
          // ---- malte flater: akvarellvask og penselstrøk, forankret i byen (ikke skjermen) ----
          vec3 nq=normalize(cross(dFdx(lp),dFdy(lp)));
          float vask=nn(wq.xz*0.045+wq.y*0.031)*0.62+nn(wq.xz*0.17+vec2(wq.y*0.23,3.1))*0.38;
          c*=1.-0.28*skravurMaske(wq, k);
          c*=1.+(vask-0.5)*0.09*uVask;   // akvarellvask, av i stil a/b
          float fwq=max(fwidth(wq.x)+fwidth(wq.z)+fwidth(wq.y),1e-4);
          float naerhet=1.-smoothstep(0.12,0.45,fwq);   // detaljer forsvinner på avstand
          if(abs(nq.y)<0.3){
            // vegg: vannrette penselstrøk
            vec2 tq=normalize(vec2(-nq.z,nq.x)); float uq=dot(wq.xz,tq);
            float strok=nn(vec2(uq*0.7, wq.y*6.0))*0.7+nn(vec2(uq*2.1, wq.y*15.))*0.3;
            c*=1.+(strok-0.5)*0.05*naerhet*uVask;
          } else if(abs(nq.y)<0.985){

            vec2 ned=normalize(nq.xz); vec2 lang=vec2(-ned.y,ned.x);

            float rad=floor(sF); float fr=fract(sF);

            float sk=fract(rF+0.5*mod(rad,2.)); float fwr=max(fwidth(rF),1e-4);

            c*=1.+(hh(vec2(floor(rF+0.5*mod(rad,2.)),rad))-0.5)*0.06*vis;

            c*=1.+(nn(vec2(dot(wq.xz,lang)*1.3, dot(wq.xz,ned)*0.25))-0.5)*0.05;
          }
          if(topp>0.){
            vec3 nl=normalize(cross(dFdx(lp),dFdy(lp)));
            if(abs(nl.y)<0.3){
              vec2 t=normalize(vec2(-nl.z,nl.x)); float u=dot(lp.xz,t);
              float rad=floor(lp.y/3.0); float fy=lp.y-rad*3.0; float fu=mod(u,2.6);
              vec2 q=vec2(fu-1.3, fy-1.55); vec2 dd=abs(q)-vec2(0.42,0.68); float inn=max(dd.x,dd.y);
              float fw=max(fwidth(u),fwidth(lp.y));
              float ok = step(rad*3.0+2.35, topp-0.25);
              float ramme=(1.-smoothstep(0.,fw,inn))*ok;
              float glass=(1.-smoothstep(-0.08,-0.08+fw,inn))*ok;
              float post=(1.-smoothstep(0.03,0.03+fw,abs(q.x)))*(1.-smoothstep(0.03,0.03+fw,abs(q.y-0.18)));
              float kryss=max(1.-smoothstep(0.03,0.03+fw,abs(q.x)), 1.-smoothstep(0.03,0.03+fw,abs(q.y-0.18)));
              vec3 hvit=vec3(0.96,0.94,0.90)*mix(1.,0.74,k);
              vec3 glas=mix(vec3(0.27,0.31,0.36),vec3(0.20,0.22,0.27),k);
              glas=mix(glas, glas*1.35, smoothstep(0.2,-0.4,q.x+q.y*0.5)*0.6);
              vec3 w=mix(hvit, glas, glass*(1.-kryss));
              float fjern=smoothstep(0.12,0.3,fw);
              // dør på gateplan i annenhver fjerde akse, som i tegningen
              float akse=floor(u/2.6);
              float dor = (rad<0.5 && mod(akse,4.)==1. && topp>3.2) ? 1. : 0.;
              vec2 qd=vec2(fu-1.3, fy-1.15); vec2 ddd=abs(qd)-vec2(0.55,1.15); float innd=max(ddd.x,ddd.y);
              float dramme=(1.-smoothstep(0.,fw,innd))*dor; float dfyll=(1.-smoothstep(-0.09,-0.09+fw,innd))*dor;
              vec3 dorf=mix(vec3(0.33,0.24,0.19),vec3(0.24,0.18,0.15),k);
              ramme*=1.-dor;
              vec3 naer=mix(c, w, ramme); naer=mix(naer, hvit, dramme); naer=mix(naer, dorf, dfyll);
              vec3 langt=mix(c, glas, 0.16*ok);
              c=mix(naer, langt, fjern);
              // sokkel og gesims
              float fwy=max(fwidth(lp.y),0.001);
              c*=mix(1.,0.84, 1.-smoothstep(0.42,0.42+fwy,lp.y));
              float ges=smoothstep(topp-0.42,topp-0.42+fwy,lp.y)*(1.-smoothstep(topp-0.12,topp-0.12+fwy,lp.y));
              c=mix(c, hvit, ges*0.55);
            }
          }
          gl_FragColor=vec4(c,1.);
          #include <colorspace_fragment>
        }`
    });
    if(opt.ds) m.side=THREE.DoubleSide;
    mats.set(key,m);
  }
  return mats.get(key);
}

// ---- kirka, bygget etter 2017-tegningen: hvitt tårn, grønt kobber, korsformet skip med valmede skifertak ----
function sentr(p){ return p.reduce((a,q)=>[a[0]+q[0]/p.length,a[1]+q[1]/p.length],[0,0]); }
function skaler(p,f){ const c=sentr(p); return p.map(q=>[c[0]+(q[0]-c[0])*f, c[1]+(q[1]-c[1])*f]); }
function oktagon(c,r,rot){ const o=[]; for(let i=0;i<8;i++){ const a=rot+i*Math.PI/4+Math.PI/8; o.push([c[0]+Math.cos(a)*r, c[1]+Math.sin(a)*r]); } return o; }
function loft(pb, pt, y0, y1, farge, grp, lukk=true){
  const pos=[]; const n=pb.length;

    pos.push(a[0],y0,-a[1], b2[0],y0,-b2[1], c[0],y1,-c[1],  a[0],y0,-a[1], c[0],y1,-c[1], d[0],y1,-d[1]); }
  if(lukk){ const cc=sentr(pt); for(let i=0;i<n;i++){ const a=pt[i], b2=pt[(i+1)%n]; pos.push(a[0],y1,-a[1], b2[0],y1,-b2[1], cc[0],y1,-cc[1]); } }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  // sørg for at flatene vender utover
  const m=new THREE.Mesh(g,mat(farge,false)); m.material.side=THREE.FrontSide; m.castShadow=true;
  const g2=g.clone(); g2.computeVertexNormals();
  const dbl=new THREE.Mesh(g, new THREE.ShaderMaterial(Object.assign({}, mat(farge,false)))); 
  const mm=new THREE.Mesh(g,mat(farge,false)); mm.castShadow=true; mm.material=mm.material.clone(); mm.material.side=THREE.DoubleSide; grp.add(mm);
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,20),edgeMat));
}
function spiss(pb, y0, y1, farge, grp){ loft(pb, pb.map(()=>sentr(pb)), y0, y1, farge, grp, false); }
function bygKirke(k, grp){
  // Domkirken slik den er tegnet i trykkfila 2019: korsformet skip med saltak i skifer, hvitt tårn med salviegrønn hjelm, lanterne og spir
  const HVIT=[252,252,252], HVIT_S=[192,196,196], SKIFER=[128,128,132], SKIFER_S=[68,68,72];
  const SALVIE=[196,228,202], SALVIE_S=[128,146,138], LANT=[176,212,190], LANT_S=[92,100,100], MORK=[92,100,100], MORK_S=[52,52,52];

    for(let i=0;i<n;i++){ const a=pb[i], b2=pb[(i+1)%n], c=pt[(i+1)%n], d=pt[i];
      pos.push(a[0],y0,-a[1], b2[0],y0,-b2[1], c[0],y1,-c[1],  a[0],y0,-a[1], c[0],y1,-c[1], d[0],y1,-d[1]); }
    if(lukk){ const cc=sentr(pt); for(let i=0;i<n;i++){ const a=pt[i], b2=pt[(i+1)%n]; pos.push(a[0],y1,-a[1], b2[0],y1,-b2[1], cc[0],y1,-cc[1]); } }

      legg(new THREE.PlaneGeometry(0.09,h-0.05).translate(0,(h-0.05)/2,0), P, tan, opp, nor, 0.13, HVIT, HVIT_S);
      legg(new THREE.PlaneGeometry(w,0.09).translate(0,h-w/2,0), P, tan, opp, nor, 0.13, HVIT, HVIT_S);
    }
  }
  function rundvindu(P, tan, opp, nor, r, kors=true){

    legg(new THREE.CircleGeometry(r,20), P, tan, opp, nor, 0.10, GLASS, GLASS_S);

      let nx=dy/L, ny=-dx/L; const mx=(p0[0]+p1[0])/2, my=(p0[1]+p1[1])/2; if((mx-c[0])*nx+(my-c[1])*ny<0){ nx=-nx; ny=-ny; }

  }

  const t0=k.torn, skc=sentr(k.skip);
  const øst=t0.map((p,i)=>[p,t0[(i+1)%t0.length]]).reduce((a,e)=>{ const m=[(e[0][0]+e[1][0])/2,(e[0][1]+e[1][1])/2]; const dd=Math.hypot(m[0]-skc[0],m[1]-skc[1]); return (!a||dd<a.d)?{m,d:dd}:a; },null).m;
  const t=t0.map(p=>[øst[0]+(p[0]-øst[0])*1.3, øst[1]+(p[1]-øst[1])*1.3]);

  add(eg,HVIT,HVIT_S);
  // korsarmene: endeveggene er de lange kantene (>12 m); motstående ende ligger seks kanter unna
  const kanter=sk.map((p,i)=>[i,Math.hypot(sk[(i+1)%sk.length][0]-p[0],sk[(i+1)%sk.length][1]-p[1])]);

  const armer=[]; ender.forEach(i=>{ const j=(i+sk.length/2)%sk.length; if(ender.includes(j) && i<j) armer.push([i,j]); });
  armer.forEach(([i,j])=>{
    const a0=sk[i], a1=sk[(i+1)%sk.length], b0=sk[j], b1=sk[(j+1)%sk.length];
    const m1=[(a0[0]+a1[0])/2,(a0[1]+a1[1])/2], m2=[(b0[0]+b1[0])/2,(b0[1]+b1[1])/2];
    const ax=[m2[0]-m1[0],m2[1]-m1[1]]; const L=Math.hypot(ax[0],ax[1]); const u=[ax[0]/L,ax[1]/L], n=[-u[1],u[0]];
    const w=Math.hypot(a1[0]-a0[0],a1[1]-a0[1])/2;

    const tg=new THREE.BufferGeometry(); tg.setAttribute('position',new THREE.Float32BufferAttribute(tak,3)); add(tg,SKIFER,SKIFER_S);
    const gv=[]; [[0,1],[L,-1]].forEach(([s_])=>{ const A=P(s_,-w,WH),B=P(s_,w,WH),C=P(s_,0,yR-0.25); gv.push(A.x,A.y,A.z,B.x,B.y,B.z,C.x,C.y,C.z); });
    const gg=new THREE.BufferGeometry(); gg.setAttribute('position',new THREE.Float32BufferAttribute(gv,3)); add(gg,HVIT,HVIT_S);

    [[0,-1],[L,1]].forEach(([s_,sg])=>{ const mid=[m1[0]+u[0]*s_, m1[1]+u[1]*s_]; if(nærTårn(mid)) return;

  });
  // høye buevinduer i alle frie skipsvegger
  flater(sk).forEach(f=>{
    if(nærTårn(f.mid) || f.L<3) return;
    const n=f.L>12 ? 3 : 2; const step=f.L/n;
    for(let i=0;i<n;i++){ const s_=step*(i+0.5); const p=[f.p0[0]+(f.p1[0]-f.p0[0])*s_/f.L, f.p0[1]+(f.p1[1]-f.p0[1])*s_/f.L];

  // ---- tårnet ----
  const SH=34, SK1=40.1, OV1=46.0, LA0=47.6, LA1=51.2, KU1=53.3, SP1=60.0;   // høyder etter forholdene i trykkfila

  loftK(ov, ov, SK1, OV1, SALVIE, SALVIE_S);                               // øvre etasje
  loftK(ov, skaler(t,0.58), OV1, OV1+0.4, SALVIE, SALVIE_S);               // gesims
  const o3=oktagon(tc, side*0.235, rot);
  loftK(skaler(t,0.58), o3, OV1+0.4, LA0, LANT, LANT_S);                  // overgang til lanterne
  loftK(o3, o3, LA0, LA1, LANT, LANT_S);                                   // lanterne

const TER = DATA.landskap && DATA.landskap.terreng;
let hAt = ()=>0;
if (TER){
  const b64=s=>{ const b=atob(s); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };
  const MB=b64(TER.m), nx=TER.nx, ny=TER.ny, G=TER.g;
  const inn=i=>(MB[i>>3]>>(7-(i&7)))&1;
  // høydene ligger bare for punktene i masken (rad for rad); utenfor er bakken null
  const H=new Uint8Array(nx*ny); H.fill(Math.round((TER.off||0)*20)); { const hk=b64(TER.h); let c=0; for(let i=0;i<nx*ny;i++) if(inn(i)) H[i]=hk[c++]; }
  const hv=(i,j)=>H[j*nx+i]/20-(TER.off||0);
  hAt=(x,y)=>{ const fx=(x-TER.x0)/G, fy=(y-TER.y0)/G; const i=Math.floor(fx), j=Math.floor(fy); if(i<0||j<0||i>=nx-1||j>=ny-1) return 0;
    const tx=fx-i, ty=fy-j; return (hv(i,j)*(1-tx)+hv(i+1,j)*tx)*(1-ty)+(hv(i,j+1)*(1-tx)+hv(i+1,j+1)*tx)*ty; };
  const pos=new Float32Array(nx*ny*3);
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const k=(j*nx+i)*3; pos[k]=TER.x0+i*G; pos[k+1]=hv(i,j)+0.03; pos[k+2]=-(TER.y0+j*G); }
  const idx=[];
  for(let j=0;j<ny-1;j++) for(let i=0;i<nx-1;i++){ const a=j*nx+i, b=a+1, c=a+nx, d=c+1; if(inn(a)+inn(b)+inn(c)+inn(d)>=2){ idx.push(a,b,c, b,d,c); } }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  const terMat=new THREE.ShaderMaterial({
    uniforms:{ lysF:{value:new THREE.Color('rgb(128,180,136)')}, skyggeF:{value:new THREE.Color('rgb(92,142,108)')} },
    vertexShader:`varying vec3 vn; varying vec3 wp; varying float ny; void main(){ vec4 w=modelMatrix*vec4(position,1.); wp=w.xyz; vn=normalize(normalMatrix*normal); ny=normal.y; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader:`uniform vec3 lysF, skyggeF; varying vec3 vn; varying vec3 wp; varying float ny;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      void main(){ vec3 nn=normalize(vn); float d=dot(nn,solRetning()); float hell=1.-ny;
        // to toner som tegningen: skråninger bort fra sola får skyggegrønt, med myk overgang
        float k = 1.-smoothstep(0.437,0.443,d);
        k *= smoothstep(0.108,0.112,hell) * smoothstep(2.2,3.4,wp.y);  // bare ekte voller (over ca. 3 m) får skyggegrønt, ikke små dumper                     // flat mark og slake banker er alltid lyse
        vec3 c=mix(lysF, skyggeF, k);
        // lys kant på vollkronen mot sola
        c=mix(c, lysF*1.06, smoothstep(0.62,0.75,d)*smoothstep(0.05,0.15,hell)*0.6);
        float m=n(wp.xz*0.025)*0.6+n(wp.xz*0.09)*0.4; c*=0.94+0.12*m;
        // gresset malt med korte penselstrøk som tegningens plener
        float gs=n(vec2(wp.x*0.55+wp.z*0.22, wp.z*1.9-wp.x*0.3))*0.6+n(vec2(wp.x*1.7, wp.z*4.3))*0.4; c*=0.975+0.05*gs;
        gl_FragColor=vec4(c,0.); // alfa 0 = terreng: ingen blekkstrek i rutenettets knekker, svakere hjørneskygge
        #include <colorspace_fragment>
      }`
  });
  medSkygge(terMat);
  const ter=new THREE.Mesh(g,terMat); ter.receiveShadow=true; scene.add(ter);

// Kronene er geometri (kuler i klaser), tegnet med samme sol, skygge og strek som husene. De var tegnede skiver (billboards) med egen
// dybdeskriving og egen skyggeoppslag fram til 24.10; på iPhone forsvant de ved zoom og dra uten at noen av delene kunne pekes ut
// (?kroner=enkel/utendybde/utenskygge/nospeil ga samme feil). Vegar: «lås størrelsene og la dem zoomes som husene.»
function lovMatLag(){
  return new THREE.ShaderMaterial({
    lights:true,
    uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.lights,{ uStoy:{value:STIL.stoy} }]),
    vertexShader:GL_SOL_V+`varying vec3 vN; varying vec3 vCol;
      void main(){
        vec4 wp=modelMatrix*instanceMatrix*vec4(position,1.);
        vN=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*normal);
        vCol=vec3(1.);
        #ifdef USE_INSTANCING_COLOR
        vCol=instanceColor;
        #endif
        gl_Position=projectionMatrix*viewMatrix*wp;`+glSolVMain('wp','vN')+`}`,
    fragmentShader:GL_SOL_F+`varying vec3 vN; varying vec3 vCol; uniform float uStoy;
      void main(){
        vec3 n=normalize(vN);
        float w=dot(n,solRetning())*0.5+0.5;
        w=mix(w, w*0.55, (1.-skyggeMask())*0.85);
        // tre toner som i tegningen: lys solside, grunnfarge, kjølig skyggeside
        float lys=smoothstep(0.60,0.64,w), mid=smoothstep(0.36,0.40,w);
        vec3 lysF=vCol*vec3(1.30,1.22,0.98)+vec3(0.04,0.045,0.0);
        vec3 mork=vCol*vec3(0.50,0.60,0.68);
        vec3 c=mix(mork, mix(vCol,lysF,lys), mid);
        gl_FragColor=vec4(c,1.);
        #include <colorspace_fragment>
      }`
  });
}
function stammeMatLag(){
  return new THREE.ShaderMaterial({
    lights:true,
    uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.lights,{ sunDir:{value:new THREE.Vector3()} }]),
    vertexShader:`#include <common>
      #include <shadowmap_pars_vertex>
      varying vec3 vN; varying vec3 vCol;
      void main(){
        #include <beginnormal_vertex>
        #include <defaultnormal_vertex>
        #include <begin_vertex>
        #include <project_vertex>
        #include <worldpos_vertex>
        #include <shadowmap_vertex>
        vN=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*objectNormal);
        vCol=vec3(1.);
        #ifdef USE_INSTANCING_COLOR
        vCol=instanceColor;
        #endif
      }`,
    fragmentShader:`#include <common>
      #include <packing>
      #include <lights_pars_begin>
      #include <shadowmap_pars_fragment>
      #include <shadowmask_pars_fragment>
      uniform vec3 sunDir; varying vec3 vN; varying vec3 vCol;
      void main(){
        float w=dot(normalize(vN),sunDir)*0.5+0.5; w=mix(w,w*0.6,(1.-getShadowMask())*0.8);
        vec3 c=mix(vCol*0.62, vCol, smoothstep(0.50,0.53,w));
        gl_FragColor=vec4(c,1.);
        #include <colorspace_fragment>
      }`
  });
}
const lovMat=lovMatLag(), stammeMat=stammeMatLag();
stammeMat.uniforms.sunDir=treU.sunDir;
// usynlige kropper som bare kaster kroneskyggen (én per tre)
const skyggeMat=new THREE.MeshBasicMaterial({colorWrite:false, depthWrite:false});
// palett fra trykkfilas trær, med Messengers varmere lysgrønn
const GREENS=[[96,148,104],[86,140,98],[104,156,106],[90,136,104],[110,160,100],[80,130,96]].map(c=>new THREE.Color(`rgb(${c[0]},${c[1]},${c[2]})`));
const BARK=[[112,92,78],[100,84,74],[122,100,84]].map(c=>new THREE.Color(`rgb(${c[0]},${c[1]},${c[2]})`));
const TP = DATA.traer;
const klaseData=[], skyggeData=[], stammeData=[];
TP.forEach((p,i)=>{
  const s=p[2]?p[2]:2.6+rnd()*2.8; const g0=p[3]||0; const col=GREENS[(rnd()*GREENS.length)|0];
  const delay=0.6+1.6*((p[0]+p[1]+500)/1000);
  const x=p[0], z=-p[1];
  const kj=(k)=>col.clone().offsetHSL((rnd()-.5)*0.02,0,(rnd()-.5)*0.05+k);
  const legg=(liste,px,py,pz,r,sy,k)=>liste.push({pos:[px,py,pz],r,sy,rot:[rnd()*6.28,rnd()*6.28,rnd()*6.28],c:kj(k),delay});
  // hovedklase, sideklaser, toppklase
  legg(klaseData, x, g0+s*1.30, z, s*0.74, 0.92, 0);
  skyggeData.push({pos:[x,g0+s*1.35,z], r:s*0.95, sy:0.9, rot:[0,0,0], c:col, delay});
  const n=3+((rnd()*2)|0), a0=rnd()*6.28;
  for(let k=0;k<n;k++){ const a=a0+k*6.28/n+(rnd()-.5)*0.8, rr=s*(0.48+rnd()*0.18);
    legg(klaseData, x+Math.cos(a)*s*0.58, g0+s*(0.95+rnd()*0.55), z+Math.sin(a)*s*0.58, rr, 0.9, (rnd()-.5)*0.04); }
  legg(klaseData, x+(rnd()-.5)*s*0.3, g0+s*1.95, z+(rnd()-.5)*s*0.3, s*(0.42+rnd()*0.1), 0.88, 0.02);
  // små løvbiter som stikker ut
  for(let k=0;k<2;k++){ const a=rnd()*6.28; legg(klaseData, x+Math.cos(a)*s*1.0, g0+s*(0.8+rnd()*0.9), z+Math.sin(a)*s*1.0, s*(0.16+rnd()*0.08), 1.0, (rnd()-.5)*0.05); }
  // stamme og to greiner
  const bark=BARK[(rnd()*BARK.length)|0].clone().offsetHSL(0,0,(rnd()-.5)*0.04);
  const tr=0.22+s*0.05;
  stammeData.push({pos:[x,g0,z], r:tr, h:s*1.35, rx:0, rz:0, ry:0, c:bark, delay});
  for(let k=0;k<2;k++){ const a=a0+k*3.14+0.7; stammeData.push({pos:[x,g0+s*0.75,z], r:tr*0.45, h:s*0.75, rx:Math.sin(a)*0.75, rz:-Math.cos(a)*0.75, ry:0, c:bark, delay}); }
});
const trMesh=[];
function lagInst(geo,mat,data){ const m=new THREE.InstancedMesh(geo,mat,Math.max(1,data.length)); m.count=data.length; m.castShadow=true; m.receiveShadow=true; m.frustumCulled=false;
  data.forEach((d,i)=>m.setColorAt(i,d.c)); if(m.instanceColor) m.instanceColor.needsUpdate=true; m.userData.data=data; trMesh.push(m); scene.add(m); return m; }
const crowns=[lagInst(KLASE,lovMat,klaseData)]; crowns[0].receiveShadow=true; crowns[0].castShadow=false;
const skyggeKropper=lagInst(SKYGGEKROPP,skyggeMat,skyggeData); skyggeKropper.receiveShadow=false;

const dummy=new THREE.Object3D();
function setCrowns(t){
  trMesh.forEach(m=>{ const st=m.userData.stamme;
    m.userData.data.forEach((c,i)=>{ const k=t===null?1:THREE.MathUtils.clamp((t-c.delay)/0.7,0,1); const e=1-Math.pow(1-k,3);
      if(st){ dummy.position.set(c.pos[0],c.pos[1],c.pos[2]); dummy.rotation.set(c.rx,0,c.rz); dummy.scale.set(c.r*(0.3+0.7*e)+0.001, c.h*e+0.001, c.r*(0.3+0.7*e)+0.001); }
      else { const g0=c.pos[1]; dummy.position.set(c.pos[0], g0*e, c.pos[2]); dummy.rotation.set(c.rot[0],c.rot[1],c.rot[2]); dummy.scale.set(c.r*e+0.001, c.r*c.sy*e+0.001, c.r*e+0.001); }
      dummy.updateMatrix(); m.setMatrixAt(i,dummy.matrix); });
    m.instanceMatrix.needsUpdate=true; });
}
// solretningen hentes fra sola hver ramme, så trærne følger samme lys som byen
crowns[0].onBeforeRender=(r,sc_,c)=>{ sun.getWorldPosition(sunW); sun.target.getWorldPosition(tgtW); treU.sunDir.value.copy(sunW).sub(tgtW).normalize(); c.getWorldDirection(camF); };
setCrowns(0);

// ---- kamerabroen: MapLibre eier kameraet; three.js-kameraet settes fra kartets matrise hvert bilde ----
// Modellen er i meter (x øst, y opp, z = -nord). MapLibre regner i mercator (x øst, y sør, z opp), så
// modellmatrisen er: flytt til origo · skaler(s,-s,s) · roter 90° om x.  (Samme oppskrift som MapLibres three.js-eksempel.)
const _merc=maplibregl.MercatorCoordinate.fromLngLat([ORIGO.lon,ORIGO.lat],0);
const MODELL=new THREE.Matrix4().makeTranslation(_merc.x,_merc.y,_merc.z)
  .multiply(new THREE.Matrix4().makeScale(1/M_PER_MERC,-1/M_PER_MERC,1/M_PER_MERC))
  .multiply(new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1,0,0),Math.PI/2));
const _mvp=new THREE.Matrix4(), _full=new THREE.Matrix4(), _inv=new THREE.Matrix4(), _pn=new THREE.Vector3(), _pf=new THREE.Vector3(), _dir=new THREE.Vector3();
kam.senter=new THREE.Vector3(10,0,0); kam.oye=new THREE.Vector3();
function kameraFraKartet(args){
  _mvp.fromArray(args.defaultProjectionData.mainMatrix); _full.multiplyMatrices(_mvp,MODELL); _inv.copy(_full).invert();
  // øyet: nær- og fjernpunktet på midtstrålen gir synsretningen; øyet ligger nærplanavstanden bak nærpunktet
  _pn.set(0,0,-1).applyMatrix4(_inv); _pf.set(0,0,1).applyMatrix4(_inv); _dir.subVectors(_pf,_pn).normalize();
  kam.naer=args.nearZ; kam.fjern=args.farZ; kam.fov=args.fov;
  kam.zoomfaktor=Math.pow(2,map.getZoom()-Z_HJEM); kam.pitch=map.getPitch(); kam.bearing=map.getBearing();
  kam.mpp=40075016.686*Math.cos(ORIGO.lat*Math.PI/180)/(512*Math.pow(2,map.getZoom()));
  // øyet ligger minst en halvmeter bak nærpunktet, så lookAt aldri får et nullvektor når kartets nearZ er nær null
  kam.oye.copy(_pn).addScaledVector(_dir,-Math.max(args.nearZ*kam.mpp,0.5));   // nearZ er i kartets pikselrom; mpp gjør det om til meter
  cam.position.copy(kam.oye); cam.up.set(0,1,0); cam.lookAt(_pn); cam.updateMatrix(); cam.updateMatrixWorld(true); cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
  cam.projectionMatrix.multiplyMatrices(_full,cam.matrixWorld); cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
  // bakkepunktet midt i bildet, og meter per skjermpunkt der
  const t=-_pn.y/_dir.y; if(isFinite(t)&&t>0) kam.senter.copy(_pn).addScaledVector(_dir,t);
}
// synsvinkler slik resten av koden forventer dem (asimut fra bearing, polarvinkel fra pitch)
function vinkler(){ return {az:-kam.bearing*Math.PI/180, pol:kam.pitch*Math.PI/180}; }
// kartet får vite hvor byen ligger, så det ikke kan dras ut av syne
const GRENSE=560;
map.setMaxBounds([tilLngLat(-GRENSE-300,-GRENSE-300), tilLngLat(GRENSE+300,GRENSE+300)]);

// ---- speilinger i vannet: hus, trær og terreng tegnes speilvendt om vannflaten i et eget, halvt så stort lag ----
const speil=(()=>{
  const Y=0.15, LAG=1;
  const rt=new THREE.WebGLRenderTarget(2,2,{type:THREE.HalfFloatType});
  const deler=[city, ...[].concat(crowns)];
  scene.traverse(o=>{ if(o.isMesh && o.material && o.material.uniforms && o.material.uniforms.skyggeF) deler.push(o); });  // festningsterrenget skjuler det som står bak vollene
  deler.forEach(o=>o.traverse(c=>c.layers.enable(LAG)));
  let paa=!Q0.get('nospeil');
  const cc=new THREE.Color();
  return {
    size(){ const w=renderer.domElement.width, h=renderer.domElement.height; rt.setSize(Math.max(2,w>>1), Math.max(2,h>>1)); },
    av(){ paa=false; waterMat.uniforms.reflStyrke.value=0; },
    render(endret){
      if(!paa){ waterMat.uniforms.reflStyrke.value=0; return; }
      // tegnes bare på nytt når kameraet eller husene har flyttet seg (stillestående bilde koster ingenting ekstra)
      const e=cam.projectionMatrix.elements, nok=e.join(',')+(endret?Math.random():'');
      if(nok===this._sist) return; this._sist=nok;
      const lagre=deler.map(o=>[o.position.y,o.scale.y]);
      deler.forEach(o=>{ o.position.y=2*Y-o.position.y; o.scale.y=-o.scale.y; });
      const bg=scene.background; scene.background=null; renderer.getClearColor(cc); const ca=renderer.getClearAlpha();
      const au=renderer.shadowMap.autoUpdate; renderer.shadowMap.autoUpdate=false;
      cam.layers.set(LAG); renderer.setRenderTarget(rt); renderer.setClearColor(0x000000,0); renderer.clear(); renderer.render(scene,cam);
      cam.layers.set(0); renderer.setRenderTarget(null); renderer.setClearColor(cc,ca); renderer.shadowMap.autoUpdate=au; scene.background=bg;
      deler.forEach((o,i)=>{ o.position.y=lagre[i][0]; o.scale.y=lagre[i][1]; });
      waterMat.uniforms.tRefl.value=rt.texture;
      // speilingen tones ned i oversikten og kommer fram når man går nærmere, så den aldri popper
      waterMat.uniforms.reflStyrke.value=speilStyrke();
    }
  };
})();

const clock=new THREE.Clock(); let _synlig=false;

const Q=Q0; let introDone=false;
if(Q.get('sol')){ const dato=Q.get('dato')||new Date().toISOString().slice(0,10); const mnd=+dato.slice(5,7); const off=(mnd>=4&&mnd<=10)?'+02:00':'+01:00';
  const p=solposisjon(new Date(dato+'T'+Q.get('sol')+':00'+off)); setSol(p.asimut,p.hoyde); }
const START = Q.get('tx') ? [+Q.get('tx'), +Q.get('ty')] : [10,0];   // ?tx=&ty= setter startpunktet (test)
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeUt=t=>1-Math.pow(1-t,4);
// ytelse: måler bildefrekvensen mens kartet beveger seg og senker kvaliteten ett trinn for godt på svake maskiner.
// Trinnet gjelder både i fart og i ro, så bildet aldri bytter utseende når en gest starter eller slutter.
let perfN=0, perfSum=0, perfLast=performance.now(), perfNivaa=Q.get('noadapt')?9:0;
function speilStyrke(){ return THREE.MathUtils.clamp(0.16+0.10*Math.log2(Math.max(kam.zoomfaktor,0.5)),0.1,0.36); }
let ssStille=4;
let speilInn=0, speilFrisk=false, sistBeveg=0, sistTegnet=0, fullTegnet=false, aoStille=14; const _sisteKam=new THREE.Matrix4(); let _sisteZ=0;
// Måler tiden vår egen tegning tar (render(), CPU-siden), ikke avstanden mellom bildene: den styres også av verten og skjermen, og
// lavere kvalitet hjelper ikke mot den. Introen (vekst + skygge hvert bilde) måles ikke; den er dyrere enn vanlig bruk.
function maalYtelse(){ const n=performance.now(); perfLast=n; if(perfNivaa>=2 || document.hidden || !introDone || !vokst || (n-sistBeveg>300 && n-sistTegnet>40)) return;
  const dt=window.__ramme||0;
  perfN++; if(perfN>15){ perfSum+=dt; if(perfN>=75){ const avg=perfSum/60; perfN=0; perfSum=0;
    if(avg>30){ settNivaa(perfNivaa+1); } } } }
// trinnene som egen funksjon, så de kan tvinges fram (?nivaa=2) og testes uten å vente på måleren
function settNivaa(n){ perfNivaa=n;
  if(n===1){ ssStille=2; skalaMaskin=0.8; }                                    // trinn 1: strek med to prøver, 80 % oppløsning
  else if(n>=2){ ssStille=1; skalaMaskin=0.6; aoStille=8; sun.shadow.mapSize.set(1024,1024); if(sun.shadow.map) sun.shadow.map.setSize(1024,1024); skyggeSkitten=true; }   // setSize beholder teksturobjektet; dispose+null ga skyggekart uten skygger og ødelagte kroner på mobil (24.10) // trinn 2: mobil som sliter
  beregnSkala(); }
if(Q.get('nivaa')) settNivaa(+Q.get('nivaa'));

// ---- tegneløkka: MapLibre kaller lagets render() hvert bilde det tegner; vi ber om nye bilder når noe beveger seg ----
lysFraVenstre();
// byen tegner seg opp: høyden vokser kvartal for kvartal (sortert sørvest -> nordøst)
const order = buildings.map(g=>{const c=g.userData.b.r; return [g, c[0]+c[1]];}).sort((a,b)=>a[1]-b[1]);
order.forEach(([g],k)=>{ g.userData.delay = 1.1*k/order.length; g.scale.y=0.001; });
let vokst=false;   // husene og trærne har vokst ferdig
function vokse(t){
  let ferdig=true;
  buildings.forEach(g=>{ const k=THREE.MathUtils.clamp((t-g.userData.delay)/0.5,0,1); g.scale.y=Math.max(0.001, 1-Math.pow(1-k,3)); if(k<1) ferdig=false; husTil(g); });
  if(t<3.4){ setCrowns(t); ferdig=false; } else setCrowns(null);
  if(ferdig) vokst=true;
}
const SPIN=3.4, VEKST_FART=1.8, Z0=0.82, EL0=52, SVEIP=110;
let anim=false, husBeveger=false, sisteTid=performance.now();
const hjemVisning=()=>({center: tilLngLat(START[0],START[1]), zoom: Z_HJEM, bearing: -AZ0_GRADER, pitch: PITCH0});
const HOME={target:new THREE.Vector3(START[0],0,-START[1])};

// intro: starter høyere og nærmere, og svinger 110° inn mot plakatvinkelen mens byen vokser opp
function startIntro(){
  map.jumpTo({center: tilLngLat(START[0],START[1]), zoom: zoomFor(Z0), bearing: -(AZ0_GRADER+SVEIP), pitch: 90-EL0});
  map.easeTo({...hjemVisning(), duration: SPIN*1000, easing: t=>1-Math.pow(1-t,4), essential:true});
  map.once('moveend', ()=>{ if(!introDone){ introDone=true; setTimeout(()=>document.getElementById('hint').style.opacity=1,300); setTimeout(()=>document.getElementById('hint').style.opacity=0,6000); } });
}
function overta(){ if(introDone) return; introDone=true; map.stop(); }
map.on('movestart', e=>{ if(e.originalEvent) overta(); });

// husets løft og vekst: egne grupper (kirka, portbygg, bygg med deler) flyttes som objekter; alle andre ligger i de sammenslåtte nettene og styres per bygg via hus-teksturen (05_bygg)
function husTil(g){ if(!g.userData.spesiell) settHus(g.userData.i, g.position.y, g.scale.y); }
// tilstand per bilde: vekst, hus som løfter seg, sol/skygge, tegnekvalitet
const _sisteProj=new THREE.Matrix4();
function oppdater(){
  maalYtelse();
  const naa=performance.now(), dt=Math.min(0.1,(naa-sisteTid)/1000); sisteTid=naa;
  const t=Q.get('t')?+Q.get('t'):clock.getElapsedTime();
  waterMat.uniforms.t.value=t;
  if(!vokst) vokse(t*VEKST_FART+0.45);
  anim=map.isMoving();
  // løftet hus (valgt) og svakt løftet hus (pekeren over), uavhengig av bildefrekvens
  const kl=1-Math.exp(-dt*11);
  husBeveger=!vokst;
  // skyggekartet tegnes på nytt bare mens et hus flytter seg merkbart (over 2 cm per bilde); halen av glidningen synes ikke i skyggen
  buildings.forEach(g=>{ const ty=g.userData.lift?3:(g===hover?0.9:0); const dy=(ty-g.position.y)*kl; if(Math.abs(dy)>1e-3){ g.position.y+=dy; husTil(g); husBeveger=true; if(Math.abs(dy)>0.02) skyggeSkitten=true; } });
  if(!introDone) skyggeSkitten=true;
  oppdaterSol();
  U_SKRAVUR.value = STIL.skravur ? kam.mpp*5*innerWidth/renderer.domElement.width*renderer.getPixelRatio() : 0;   // skravur: 5 skjermpunkter mellom strekene
  // én kvalitet: oppløsning, hjørneskygge og strek er de samme i fart og i ro (se 00_oppsett). «stille» styrer bare speilet i vannet.
  const kamFlytt = !_sisteProj.equals(cam.projectionMatrix); _sisteProj.copy(cam.projectionMatrix);
  if(kamFlytt || anim || !introDone) sistBeveg=naa;
  const stille = naa-sistBeveg>300;
  post.settSkala(skalaStille); post.setAO(aoStille); post.setSS(ssStille);
  if(introDone && stille){ speilInn=Math.min(1,speilInn+dt*2.8); speil.render(husBeveger || speilInn<1 || !speilFrisk); speilFrisk=true; }
  else if(!stille){ speilFrisk=false; speilInn=Math.max(0,speilInn-dt*8); } // gammelt speil vises aldri mens kartet beveger seg
  waterMat.uniforms.reflStyrke.value=speilStyrke()*speilInn;
  sistTegnet=naa; fullTegnet=stille && !husBeveger;
  dbgTegn(naa);
}
// laget: kartet tegner byen gjennom dette
const byLag={ id:'byen', type:'custom', renderingMode:'3d',
  onAdd(){ post.size(); speil.size(); },
  render(gl,args){ window.__vaareBilder++; const t0=performance.now(); window.__mellom=t0-(window.__slutt||t0); kameraFraKartet(args); renderer.resetState(); gl.depthRange(0,1); oppdater(); post.render(); window.__slutt=performance.now(); window.__ramme=window.__slutt-t0; if(!_synlig){ _synlig=true; requestAnimationFrame(()=>map.getCanvas().style.opacity=1); } } };
// ber kartet tegne på nytt når noe beveger seg; i ro tegnes det 10 ganger i sekundet (vannet lever)
function puls(){ const naa=performance.now(); if(!vokst || !introDone || husBeveger || map.isMoving() || naa-sistTegnet>100) map.triggerRepaint(); requestAnimationFrame(puls); }
// teller kartets egne bilder mot våre: tegner kartet et bilde uten å kalle laget vårt, blir det et papirfarget blink
window.__kartBilder=0; window.__vaareBilder=0; map.on('render', ()=>{ window.__kartBilder++; });
map.on('load', ()=>{
  map.addLayer(byLag);
  if(Q.get('skip')){ introDone=true; vokst=true; buildings.forEach(g=>{ g.scale.y=1; husTil(g); }); setCrowns(null); map.jumpTo({...hjemVisning(), bearing: Q.get('az')?-(+Q.get('az')):-AZ0_GRADER, zoom: Q.get('zoom')?zoomFor(+Q.get('zoom')):Z_HJEM}); }
  else startIntro();
  puls();
});
// testkroker (skjermbilder uten ny sidelasting)
window.__skjerm=(x,z)=>{ const v=new THREE.Vector3(x,0,z).project(cam); return [(v.x+1)/2*innerWidth, (1-v.y)/2*innerHeight]; };
window.__kam=()=>{ const v=vinkler(); let vs=null; if(valgt){ const c=husBoks(valgt).getCenter(new THREE.Vector3()); vs=window.__skjerm(c.x,c.z); } return {x:kam.senter.x,z:kam.senter.z,zoom:kam.zoomfaktor,az:v.az,pol:v.pol,anim:map.isMoving(),valgt:vs,intro:!introDone,t:clock.getElapsedTime(),oye:kam.oye.toArray(), naer:kam.naer, fjern:kam.fjern, fov:kam.fov, mpp:kam.mpp}; };
window.__vis=(az,zoom,tx,ty)=>{ introDone=true; vokst=true; buildings.forEach(g=>{ g.scale.y=1; husTil(g); }); setCrowns(null); map.jumpTo({center: tilLngLat(tx,ty), zoom: zoomFor(zoom), bearing: -az, pitch: PITCH0}); };
window.__scene=()=>({scene, city});   // feilsøk: tell objekter i scenen (verktoy/tell.mjs)
window.__kval=()=>({skala:post.skala(), ao:aoStille, ss:ssStille, perfNivaa, stille:performance.now()-sistBeveg>300, beveger:map.isMoving()});
window.__skjerm3=(x,y,z)=>{ const v=new THREE.Vector3(x,y,z).project(cam); return [(v.x+1)/2*innerWidth, (1-v.y)/2*innerHeight]; };

// ---- klikk, peker, huskort, hjem, styreflate og feilsøking. Dra, klyp, vri, vipp, hjul og dobbeltklikk er MapLibres egne. ----
const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2(); let valgt=null, klikkTimer=null, hover=null;
const kort=document.getElementById('kort'); const hjem=document.getElementById('hjem');
// treff: strålen mot alt i byen; i de sammenslåtte nettene gir trekantnummeret hvilket bygg som ble truffet (husDeler, 07)
function byggFraTreff(hit){
  if(hit.object.isInstancedMesh && hit.object.geometry.getAttribute('aBygg')){ const k=hit.object.geometry.getAttribute('aBygg').getX(hit.instanceId)-1; return k>=0 ? buildings.find(g=>g.userData.i===k) : null; }
  const f=hit.faceIndex*3;
  for(const [i,deler] of husDeler){ for(const d of deler){ if(d.mesh===hit.object && f>=d.start && f<d.start+d.antall) return buildings.find(g=>g.userData.i===i); } }
  let g=hit.object; while(g.parent && g.parent!==city) g=g.parent; return g.parent===city && g.userData && g.userData.b ? g : null;
}
function treffHus(x,y){ ptr.set(x/innerWidth*2-1, -(y/innerHeight)*2+1); ray.setFromCamera(ptr,cam);
  const hit=ray.intersectObjects(city.children,true).find(h=>h.object.isMesh); if(!hit) return null;
  const g=byggFraTreff(hit); return g ? {g, p:hit.point} : null; }
// bygget som boks (til kamera og kort): egne grupper måles, sammenslåtte bygg regnes ut fra grunnrisset og høyden
function husBoks(g){ if(g.userData.spesiell || !g.userData.b || !g.userData.b.p) return new THREE.Box3().setFromObject(g);
  const bb=new THREE.Box3(); g.userData.b.p.forEach(([x,y])=>{ bb.expandByPoint(new THREE.Vector3(x,0,-y)); bb.expandByPoint(new THREE.Vector3(x,g.userData.h+g.position.y,-y)); }); return bb; }
function velg(x,y){
  const h=treffHus(x,y);
  if(valgt){valgt.userData.lift=false; valgt=null;}
  if(!h){kort.classList.remove('vis'); return;}
  const g=h.g; valgt=g; g.userData.lift=true;
  const b=g.userData.b;
  kort.querySelector('h2').textContent = b.navn || b.adr || 'Bygg i Gamlebyen';
  kort.querySelector('.a').textContent = b.adr || (b.tekst ? 'Fra kartbrosjyren til Visit Fredrikstad (2015)' : ''); // OSM-typen (engelsk, f.eks. «office») vises ikke
  kort.querySelector('.b').textContent = b.tekst || 'Historie, bilder og bruk kommer her.';
  const f=kort.querySelector('.farge'); f.innerHTML='';
  if(b.vegg){ f.innerHTML += `<i style="background:rgb(${b.vegg})"></i>Godkjent fasadefarge`; }
  kort.classList.add('vis');
  // står huset under kortet eller utenfor bildet, glir kartet rolig så huset blir synlig over kortet
  const s=new THREE.Vector3(h.p.x,0,h.p.z).project(cam);
  const kortTopp = 1-2*Math.max(0.2, (kort.offsetTop||innerHeight*0.72)/innerHeight);   // kortets plass uten innglidningen
  if(s.y < kortTopp+0.12 || Math.abs(s.x)>0.85 || s.y>0.88){
    const px=(s.x+1)/2*innerWidth, py=(1-s.y)/2*innerHeight;
    map.panBy([px-innerWidth/2, py-innerHeight*0.4], {duration:700, easing:t=>1-Math.pow(1-t,3)});
  }
}
function hjemNaa(){ map.easeTo({...hjemVisning(), duration:900, easing:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}); if(valgt){valgt.userData.lift=false; valgt=null;} kort.classList.remove('vis'); }
hjem.onclick=()=>{ overta(); hjemNaa(); }; window.__hjem=()=>{ overta(); hjemNaa(); };
addEventListener('keydown',e=>{ if(e.key==='Escape'){ overta(); hjemNaa(); } });
// ett klikk velger et hus (ventes 300 ms så et dobbeltklikk kan zoome i stedet)
map.on('click', e=>{ if(!introDone) return; clearTimeout(klikkTimer); const p=e.point; klikkTimer=setTimeout(()=>velg(p.x,p.y),300); });
map.on('dblclick', ()=>clearTimeout(klikkTimer));
// peker over et hus (bare mus): huset løfter seg litt
let sisteHover=0;
map.on('mousemove', e=>{ if(e.originalEvent.buttons || map.isMoving() || !introDone){ if(hover){ hover=null; map.getCanvas().style.cursor=''; } return; }
  const n=performance.now(); if(n-sisteHover<45) return; sisteHover=n;
  const h=treffHus(e.point.x,e.point.y); hover=h?h.g:null; map.getCanvas().style.cursor=hover?'pointer':''; });
map.on('mouseout', ()=>{ hover=null; map.getCanvas().style.cursor=''; });
// styreflate på Mac: to fingre flytter kartet (som Apple og Google Maps), klyp zoomer (ctrl+hjul), et musehjul zoomer.
// Én gest er én ting: første hendelse avgjør, hendelser innen 120 ms arver valget.
const gest={t:0,hjul:false};
map.getCanvasContainer().addEventListener('wheel', e=>{
  if(e.ctrlKey || e.metaKey) return;                      // klyp på styreflaten (ctrl) eller ⌘ og rull (Magic Mouse) = zoom, MapLibre tar den
  const naa=performance.now();
  let hjul = e.deltaMode!==0 || (e.deltaX===0 && e.wheelDeltaY && e.wheelDeltaY%120===0 && e.wheelDeltaY!==-3*e.deltaY);
  if(gest.t && naa-gest.t<120) hjul=gest.hjul;
  gest.t=naa; gest.hjul=hjul; dbgLogg(e,hjul);
  if(hjul) return;                                        // musehjul = zoom, MapLibre tar den
  e.preventDefault(); e.stopImmediatePropagation(); overta();
  map.panBy([e.deltaX, e.deltaY], {animate:false});       // innholdet følger fingrene
}, {capture:true, passive:false});
function visHjem(){ const c=tilModell(map.getCenter()); const borte = Math.abs(map.getZoom()-Z_HJEM)>0.07 || Math.hypot(c[0]-START[0], c[1]-START[1])>8 || Math.abs(((map.getBearing()+AZ0_GRADER+540)%360)-180)>4; hjem.classList.toggle('vis', introDone && borte); }
map.on('move', visHjem); map.on('moveend', visHjem);
kort.querySelector('.lukk').onclick=()=>{kort.classList.remove('vis'); if(valgt){valgt.userData.lift=false; valgt=null;}};
// feilsøkingsrute (tast d): bildefrekvens, tegnetilstand og styreflatehendelser som tall. Taster s/a/x/p prøver stillbildekvalitet.
const dbg={paa:false, rader:[], el:null, fps:[], pek:{ned:0,flytt:0,opp:0,sist:'',knapper:0,type:''}};
// pekerhendelser som når kartet (for å se om dra virker der kartet vises)
['pointerdown','pointermove','pointerup'].forEach(t=>map.getCanvasContainer().addEventListener(t,e=>{ if(!dbg.paa) return; dbg.pek[t==='pointerdown'?'ned':t==='pointermove'?'flytt':'opp']++; dbg.pek.sist=`${t} ${e.clientX|0},${e.clientY|0}`; dbg.pek.knapper=e.buttons; dbg.pek.type=e.pointerType; },{capture:true,passive:true}));
function dbgLogg(e,hjul){ if(!dbg.paa) return; dbg.rader.push(`${(performance.now()%100000|0)} dx${e.deltaX.toFixed(1)} dy${e.deltaY.toFixed(1)} w${e.wheelDeltaY} m${e.deltaMode} ${e.ctrlKey?'ctrl ':''}${hjul?'ZOOM':'flytt'}`); if(dbg.rader.length>40) dbg.rader.shift(); }
// bildefrekvens i siste bevegelse (dra, animasjon): telles mens kartet beveger seg og står igjen etterpå, så den kan leses av i ro
const fart={i:false, t0:0, n:0, sist:''};
function dbgTegn(naa){ if(!dbg.paa) return; dbg.fps.push(naa); while(dbg.fps.length&&naa-dbg.fps[0]>1000) dbg.fps.shift();
  const pt=window.__pt||{};
  if(map.isMoving()){ if(!fart.i){ fart.i=true; fart.t0=naa; fart.n=0; fart.s=0; fart.b=0; fart.f=0; fart.sk=0; fart.r=0; fart.m=0; fart.k0=window.__kartBilder; fart.v0=window.__vaareBilder; } fart.n++; fart.s+=pt.scene||0; fart.b+=pt.blekk||0; fart.f+=pt.fxaa||0; fart.sk+=pt.skygge||0; fart.r+=window.__ramme||0; fart.m+=window.__mellom||0; }
  else if(fart.i){ fart.i=false; const ms=naa-fart.t0, n=fart.n; if(ms>150) fart.sist=`siste bevegelse ${ms|0} ms, ${n} bilder = ${(n*1000/ms).toFixed(0)}/s  (snitt per bilde: 3D ${(fart.s/n).toFixed(0)} ms, blekk ${(fart.b/n).toFixed(0)} ms, fxaa ${(fart.f/n).toFixed(0)} ms, skyggekart i ${fart.sk} av ${n}, hele render() ${(fart.r/n).toFixed(0)} ms, mellom bildene ${(fart.m/n).toFixed(0)} ms, kartet tegnet ${window.__kartBilder-fart.k0} bilder, laget vårt ${window.__vaareBilder-fart.v0}${pt.maal?', GPU-målt':', CPU-målt, tast m for GPU'})`; }
  const glFeil=gl2.getError();
  dbg.el.textContent=`v${document.querySelector('meta[name=description]').content.match(/Versjon ([\d.]+)/)[1]}  nær ${kam.naer.toFixed(1)} fjern ${kam.fjern.toFixed(0)}  glFeil ${glFeil}  kall ${(window.__pt||{}).kall}  dpr ${devicePixelRatio}  ${innerWidth}x${innerHeight}\ntegnet/s ${dbg.fps.length} (i ro tegnes det 10/s med vilje)  zoom ${map.getZoom().toFixed(2)} (x${kam.zoomfaktor.toFixed(2)})  pitch ${kam.pitch.toFixed(0)}  bearing ${kam.bearing.toFixed(0)}  perfNivaa ${perfNivaa}  skala ${skalaStille.toFixed(2)}  stille ${naa-sistBeveg>300?1:0}  ss ${ssStille} ao ${aoStille} msaa ${post.samples()}`
    +String.fromCharCode(10)+fart.sist
    +String.fromCharCode(10)+`3D ${pt.scene|0} ms  blekk ${pt.blekk|0} ms  fxaa ${pt.fxaa|0} ms  kall ${pt.kall}  tri ${pt.tri}  skyggekart ${pt.skygge} (grunner: ${JSON.stringify(dekning.grunner)})  ${pt.maal?'GPU-målt':'CPU-målt'}`+String.fromCharCode(10)+`peker: ned ${dbg.pek.ned} flytt ${dbg.pek.flytt} opp ${dbg.pek.opp}  sist ${dbg.pek.sist}  knapper ${dbg.pek.knapper} ${dbg.pek.type}  senter ${tilModell(map.getCenter()).map(v=>v.toFixed(0)).join(',')}  dragPan ${map.dragPan.isEnabled()?'på':'av'} aktiv ${map.dragPan.isActive()?'ja':'nei'}`+String.fromCharCode(10)+dbg.rader.join(String.fromCharCode(10)); }
addEventListener('keydown',e=>{ if(!dbg.paa) return; if(e.key==='s'){ ssStille=ssStille===4?2:ssStille===2?1:4; } if(e.key==='a'){ aoStille=aoStille===14?7:aoStille===7?0:14; } if(e.key==='x'){ skalaStille=skalaStille===1?0.75:1; } if(e.key==='p'){ speil.av(); } if(e.key==='m'){ window.__maal=!window.__maal; } if(e.key==='n'){ post.msaa(post.samples()?0:2); } });
function dbgVeksle(){ dbg.paa=!dbg.paa; if(!dbg.el){ dbg.el=document.createElement('pre'); dbg.el.style.cssText='position:fixed;left:8px;top:8px;z-index:9;margin:0;padding:8px;font:11px/1.25 ui-monospace,monospace;background:rgba(255,255,255,.92);color:#222;max-height:92vh;overflow:hidden;pointer-events:none;border-radius:6px'; document.body.appendChild(dbg.el); } dbg.el.style.display=dbg.paa?'block':'none'; }
addEventListener('keydown',e=>{ if(e.key==='d'&&!e.metaKey&&!e.ctrlKey) dbgVeksle(); });
// mobil: ?d=1 slår ruta på fra start (ingen tastatur), større skrift, og glen-feil + nær/fjern tas med
if(Q0.get('d')){ dbgVeksle(); dbg.el.style.font='13px/1.3 ui-monospace,monospace'; dbg.el.style.maxWidth='96vw'; dbg.el.style.whiteSpace='pre-wrap'; }

</script>
</body>
</html>
