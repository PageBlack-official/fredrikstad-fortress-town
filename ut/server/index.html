:root{--bg:#e2e1d6;--ink:#2b2420;--paper:#f6f3ea;--muted:#7a7166}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#e2e1d6;--ink:#2b2420;--paper:#f6f3ea;--muted:#7a7166}}
:root[data-theme="dark"]{--bg:#e2e1d6;--ink:#2b2420;--paper:#f6f3ea;--muted:#7a7166}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#kart{position:fixed;inset:0;background:var(--bg)}
.maplibregl-canvas{opacity:0;transition:opacity .45s ease-out;outline:none}
.maplibregl-ctrl-attrib{display:none}
:root{color-scheme:light}
#hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;letter-spacing:.02em;color:var(--ink);background:rgba(246,243,234,.82);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:normal;max-width:min(88vw,560px);text-align:center;line-height:1.45}
#hjem{z-index:4;position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;border:0;border-radius:22px;padding:10px 14px;background:rgba(246,243,234,.92);color:var(--ink);font:500 13px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;box-shadow:0 4px 16px rgba(40,30,20,.14);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity var(--t-kort-ut,240ms) var(--k-flytt,ease),transform var(--t-kort-ut,240ms) var(--k-flytt,ease)}
#hjem.vis{opacity:1;pointer-events:auto;transform:none;transition-duration:var(--t-kort-inn,380ms)}
#hjem:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* huskortet (29.10): bunnark på smal skjerm, sidepanel fra venstre på bred. Tider og kurver fra 15_bevegelse.js (--t-…, --k-…):
   inn bremser (Material emphasized decelerate), ut akselererer og er kortere. Bare transform og opacity animeres (ingen ny layout per bilde). */
#kort{z-index:5;position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:380px;margin:0 auto;background:var(--paper);border-radius:14px;padding:16px 18px;box-shadow:0 10px 30px rgba(40,30,20,.18);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform var(--t-kort-ut,240ms) var(--k-ut,cubic-bezier(.3,0,.8,.15)),visibility 0s var(--t-kort-ut,240ms);touch-action:none;will-change:transform}
#kort.vis{transform:none;visibility:visible;transition:transform var(--t-kort-inn,380ms) var(--k-inn,cubic-bezier(.05,.7,.1,1)),visibility 0s}
#kort .grep{width:36px;height:4px;border-radius:2px;background:rgba(43,36,32,.18);margin:-8px auto 10px}
@media (min-width:720px){
  #kort{left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));right:auto;bottom:auto;width:340px;max-width:calc(100vw - 32px);max-height:calc(100% - 32px);overflow:auto;margin:0;transform:translateX(calc(-100% - 40px));touch-action:auto}
  #kort .grep{display:none}
}
/* «Reduser bevegelse» gjelder ikke kortet: Vegars valg (CHANGELOG v27, se 15_bevegelse.js) */
#kort h2{margin:0 0 4px;font-size:18px;font-weight:600}
#kort p{margin:2px 0;font-size:13px;color:var(--muted)}
#kort .lukk{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
#kort .farge{display:flex;gap:6px;margin-top:10px;align-items:center;font-size:12px;color:var(--muted)}
#kort .her{list-style:none;margin:8px 0 0;padding:0;font-size:14px;line-height:1.45;color:var(--ink)}
#kort .her:empty,#kort .id:empty,#kort .b:empty{display:none}
#kort .id{margin-top:8px;font-size:11px;letter-spacing:.02em;opacity:.8}
#kort .farge i{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}

/* MapLibre-knappene i kartets papirtone */
.maplibregl-ctrl-bottom-right{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.maplibregl-ctrl-group{background:rgba(246,243,234,.92);border-radius:14px;box-shadow:0 4px 16px rgba(40,30,20,.14);overflow:hidden}
.maplibregl-ctrl-group button{width:38px;height:38px;border-color:rgba(43,36,32,.12)}
.maplibregl-ctrl-group button+button{border-top:1px solid rgba(43,36,32,.12)}
.maplibregl-ctrl button:not(:disabled):hover{background-color:rgba(43,36,32,.06)}
#kort.vis~.maplibregl-control-container .maplibregl-ctrl-bottom-right{opacity:.35}
</style>

<script type="module">

const STIL=(()=>{ const v=Q0.get('stil')||'a';

// sola står fast i byen (modell), ikke i øyet (plakat): hjemmevisningen er lik trykket, og skyggene snur seg med byen. ?sol=plakat gir den gamle.
const SOL_FAST = Q0.get('sol')!=='plakat';

// hjemmevisningen (26.10, Vegar: «sluttbildet i dette utsnittet»): byen sett fra elva, kirka oppe til høyre, litt brattere enn plakaten.
// Før: plakatvinkelen (asimut 40/130, høyde 33°). ?hjem=plakat gir den gamle.
const HJEM_PLAKAT=Q0.get('hjem')==='plakat';

const gl2 = map.getCanvas().getContext('webgl2');
const renderer = new THREE.WebGLRenderer({canvas: map.getCanvas(), context: gl2, antialias:true});
renderer.autoClear=false;
// én tegnekvalitet: bildet tegnes likt om kartet beveger seg eller står stille, så skygger og strek aldri hopper mellom grov og fin.

// Vegar 28.10; ytelsesmåleren trappet først ned etter 75 trege bilder). ?pix=<millioner> overstyrer.
const BERORING = window.matchMedia('(pointer: coarse)').matches;
const PIX=Q0.get('pix') ? +Q0.get('pix')*1e6 : (BERORING ? 5e6 : 11e6);
let skalaStille=1, skalaMaskin=1;   // skalaMaskin: 1 på vanlige maskiner, lavere når maalYtelse har målt at maskinen ikke holder følge

map.on('webglcontextlost',()=>{ if(!sessionStorage.getItem('gl-tapt')){ sessionStorage.setItem('gl-tapt','1'); location.reload(); } });

scene.background = new THREE.Color(0xe2e1d6);

const cam = new THREE.PerspectiveCamera(60, 1, 1, 10000);
cam.matrixAutoUpdate=false;
const kam={zoomfaktor:1, mpp:1, pitch:PITCH0, bearing:-AZ0_GRADER, naer:1, fjern:10000};   // avledet av kartet hvert bilde
function fit(){ post.size(); }
map.on('resize',fit);

// ---- etterbehandling: blekkstrek rundt alle former og skygge i hjørner, som i tegningen ----
const post=(()=>{
  let W=2, H=2, skala=1;
  const rt=new THREE.WebGLRenderTarget(2,2,{samples: devicePixelRatio>=1.5?2:4, type:THREE.HalfFloatType});

    uniforms:{tCol:{value:rt.texture}, tDep:{value:rt.depthTexture}, res:{value:new THREE.Vector2(2,2)}, mpp:{value:1}, span:{value:8000}, naer:{value:1}, fjern:{value:10000}, px:{value:1}, tilt:{value:0}, aoN:{value:14}, ssN:{value:1}, tid:{value:0}, sk:{value:1}, dpr:{value:1}, invPV:{value:new THREE.Matrix4()}, blekk:{value:new THREE.Color(0x24211f)}, tPensel:{value:penselTex}, uPensel:{value:STIL.pensel}, uKorn:{value:STIL.korn}, uVignett:{value:STIL.vignett}, uKurve:{value:STIL.kurve}, uSky:{value:STIL.sky}},
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:`uniform sampler2D tCol, tDep, tPensel; uniform vec2 res; uniform float uKurve; uniform float mpp, span, px, tilt, aoN, tid, sk, dpr, ssN, naer, fjern, uPensel, uKorn, uVignett, uSky; uniform mat4 invPV; uniform vec3 blekk;
 varying vec2 vUv;
      // dybde i meter langs synsretningen (perspektiv: dybdebufferet lineariseres med kartets nær/fjern-plan)

        float L2=max(abs(a2+b2-2.*ec), abs(c2+d2-2.*ec))/(mpp*s2);

      }
      float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}

      // Målet er satt i skjermverdier (99,9-persentilen i hjemmevisningen 222–243, ingen piksel over ca. 240), men dette passet skriver
      // lineært til et sRGB-mål (skjermkoden legges på av grafikkortet), så knekk og tak står her som lineære verdier: 230/255 → 0,787, 241/255 → 0,880.
      const float KNE=0.787, TAK=0.880;

      void main(){

          for(int i=0;i<12;i++){ float a=float(i)*2.39996; float r=tb*7.*sqrt((float(i)+.5)/12.);

        float wi=clamp(0.22/mppC, 0.65, 1.5);               // tynn i oversikten, fyldigere tett på
        float s1=max(1.,floor(wi*dpr*sk*0.75+0.5)), s2=max(s1+1.,floor(wi*dpr*sk*1.2+0.5)); // hele piksler: ingen falske linjer på flat mark
        // lavfrekvent skjelving (bølgelengde ca. 40 px), som en tusj som ikke følger linjalen
        float fq=1./(40.*mpp);

                              +strekVed(wob+vec2(-0.375,0.125)*2.,s1,s2,mpp)+strekVed(wob+vec2(0.125,0.375)*2.,s1,s2,mpp)); ink=smoothstep(0.,0.85,ink); }

        ink*=mix(1., 0.62+0.38*pen2, uPensel);
        float brudd=smoothstep(0.36,0.52, pen);

        if(c2<zn){ zn=c2; cn=texture2D(tCol,vUv+(wob+vec2(0.,s2))/res).rgb; }

        // skygge i hjørner og der hus møter bakken (planbevisst, så flat bakke ikke mørkner)

        float R=clamp(2.4/mpp, 4., 48.); float ao=0.; float j=h(gl_FragCoord.xy)*6.2831;

        col*=mix(vec3(1.),vec3(0.60,0.645,0.76),ao*aC); // hjørneskygge i himmeltone, ikke grå
        // skyskygger som driver sakte over byen

        float rr=length((wxz-vec2(10.,0.))*vec2(0.85,1.0));

  });
  const q=new THREE.Mesh(new THREE.PlaneGeometry(2,2),m); q.frustumCulled=false;

    fragmentShader:FXAAShader.fragmentShader.replace(/\}\s*$/, '  #include <colorspace_fragment>\n}') });

// Korsarmene (30.10, natt/farge): valm i endene, som kvartaltegningen kirke.ai (trekantet takflate over hver endevegg, ingen gavlvegg)

function bygKirke(k, grp){
  // Domkirken slik den er tegnet i trykkfila 2019: korsformet skip med saltak i skifer, hvitt tårn med salviegrønn hjelm, lanterne og spir

  const W3=(p,y)=>new THREE.Vector3(p[0],y,-p[1]);
  function loftK(pb, pt, y0, y1, f, sk, lukk=true){
    const pos=[]; const n=pb.length;
    for(let i=0;i<n;i++){ const a=pb[i], b2=pb[(i+1)%n], c=pt[(i+1)%n], d=pt[i];
      pos.push(a[0],y0,-a[1], b2[0],y0,-b2[1], c[0],y1,-c[1],  a[0],y0,-a[1], c[0],y1,-c[1], d[0],y1,-d[1]); }
    if(lukk){ const cc=sentr(pt); for(let i=0;i<n;i++){ const a=pt[i], b2=pt[(i+1)%n]; pos.push(a[0],y1,-a[1], b2[0],y1,-b2[1], cc[0],y1,-cc[1]); } }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals(); return add(g,f,sk);
  }
  // flat ornament (vindu, urskive) lagt på en flate: basis = tangent, opp, normal
  function legg(geo, P, tan, opp, nor, off, f, sk){
    const m4=new THREE.Matrix4().makeBasis(tan,opp,nor); m4.setPosition(P.clone().addScaledVector(nor,off)); geo.applyMatrix4(m4); return add(geo,f,sk);
  }
  function bue(w,h){ const s=new THREE.Shape(); const r=w/2; s.moveTo(-r,0); s.lineTo(r,0); s.lineTo(r,h-r); s.absarc(0,h-r,r,0,Math.PI,false); s.lineTo(-r,0); return s; }
  function buevindu(P, tan, opp, nor, w, h, sprosser=true){
    legg(new THREE.ShapeGeometry(bue(w+0.36,h+0.18),10), P.clone().addScaledVector(opp,-0.09), tan, opp, nor, 0.06, HVIT, HVIT_S);
    legg(new THREE.ShapeGeometry(bue(w,h),10), P, tan, opp, nor, 0.10, GLASS, GLASS_S);
    if(sprosser){
      legg(new THREE.PlaneGeometry(0.09,h-0.05).translate(0,(h-0.05)/2,0), P, tan, opp, nor, 0.13, HVIT, HVIT_S);
      legg(new THREE.PlaneGeometry(w,0.09).translate(0,h-w/2,0), P, tan, opp, nor, 0.13, HVIT, HVIT_S);
    }
  }
  function rundvindu(P, tan, opp, nor, r, kors=true){
    legg(new THREE.CircleGeometry(r+0.17,20), P, tan, opp, nor, 0.06, HVIT, HVIT_S);
    legg(new THREE.CircleGeometry(r,20), P, tan, opp, nor, 0.10, GLASS, GLASS_S);
    if(kors){ legg(new THREE.PlaneGeometry(0.08,2*r), P, tan, opp, nor, 0.13, HVIT, HVIT_S); legg(new THREE.PlaneGeometry(2*r,0.08), P, tan, opp, nor, 0.13, HVIT, HVIT_S); }
  }
  // flatene til en mangekant: utovervendt normal og tangent
  function flater(poly){
    const c=sentr(poly); const out=[];
    for(let i=0;i<poly.length;i++){ const p0=poly[i], p1=poly[(i+1)%poly.length]; const dx=p1[0]-p0[0], dy=p1[1]-p0[1]; const L=Math.hypot(dx,dy);
      let nx=dy/L, ny=-dx/L; const mx=(p0[0]+p1[0])/2, my=(p0[1]+p1[1])/2; if((mx-c[0])*nx+(my-c[1])*ny<0){ nx=-nx; ny=-ny; }

  const armer=[]; ender.forEach(i=>{ const j=(i+sk.length/2)%sk.length; if(ender.includes(j) && i<j) armer.push([i,j]); });
  armer.forEach(([i,j])=>{
    const a0=sk[i], a1=sk[(i+1)%sk.length], b0=sk[j], b1=sk[(j+1)%sk.length];

      [[P(s0,we,yE),P(s0,-we,yE),P(r0,0,yR)],[P(s1,-we,yE),P(s1,we,yE),P(r1,0,yR)]].forEach(([A,B,C])=>tak.push(...[A,B,C].flatMap(v=>[v.x,v.y,v.z])));

    const tg=new THREE.BufferGeometry(); tg.setAttribute('position',new THREE.Float32BufferAttribute(tak,3)); add(tg,SKIFER,SKIFER_S);

  const fraVenstre=(f,u)=>{ const nx=f.nor.x, ny=-f.nor.z; const ltr=((f.p1[0]-f.p0[0])*(-ny)+(f.p1[1]-f.p0[1])*nx)>0; return ltr?u:1-u; };
  function kirkedor(f, u, stor){

    const p=[f.p0[0]+(f.p1[0]-f.p0[0])*s_, f.p0[1]+(f.p1[1]-f.p0[1])*s_]; const opp=new THREE.Vector3(0,1,0);
    if(stor){ legg(new THREE.ShapeGeometry(bue(3.8,5.8),16), W3(p,-0.05), f.tan, opp, f.nor, 0.05, [150,150,146], [100,100,98]);   // omramming (rundbuet, som i tegningen)

  const {SH, SK1, OV1, LA0, LA1, KU1, SP1, TS}=HK;   // TS: skala for detaljene over muren
  const te=new THREE.ExtrudeGeometry(polyShape(t),{depth:SH,bevelEnabled:false}); te.rotateX(-Math.PI/2); add(te,HVIT,HVIT_S);

      buevindu(W3(c2,SH*0.55), f.tan, opp, f.nor, 1.6, 3.6);     // som i tegningen: buevindu ~2/3 opp, ovalene på ~1/3 og ~1/6
      rundvindu(W3(c2,SH*0.35), f.tan, opp, f.nor, 0.85);

    }

    const hatt=new THREE.Mesh(new THREE.ConeGeometry(1.12*TS,0.9*TS,4,1), M(LANT,LANT_S)); hatt.position.copy(bm.position).add(new THREE.Vector3(0,1.4*TS,0)); hatt.rotation.y=-rot+Math.PI/4; grp.add(hatt);
    const luke=W3(ap,ys+0.05*TS).addScaledVector(f.nor,0.95*TS);
    legg(new THREE.ShapeGeometry(bue(0.9*TS,1.3*TS),8), luke, f.tan, opp, f.nor, 0.0, MORK, MORK_S);

  // inngangsdør i tårnfoten mot vest (siden lengst fra skipet)
  const fot=flater(t).reduce((a,f)=>{ const d=Math.hypot(f.mid[0]-sentr(sk)[0],f.mid[1]-sentr(sk)[1]); return (!a||d>a.d)?{f,d}:a; },null).f;
  legg(new THREE.ShapeGeometry(bue(2.6,4.8),12), W3(fot.mid,0).addScaledVector(opp,-0.05), fot.tan, opp, fot.nor, 0.06, HVIT, HVIT_S);
  legg(new THREE.ShapeGeometry(bue(2.1,4.4),12), W3(fot.mid,0), fot.tan, opp, fot.nor, 0.10, [104,86,72], [72,60,52]);
}

const TER = DATA.landskap && DATA.landskap.terreng;

  const b64=s=>{ const b=atob(s); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };
  const MB=b64(TER.m), nx=TER.nx, ny=TER.ny, G=TER.g;

    const tx=fx-i, ty=fy-j; return (hv(i,j)*(1-tx)+hv(i+1,j)*tx)*(1-ty)+(hv(i,j+1)*(1-tx)+hv(i+1,j+1)*tx)*ty; };
  const pos=new Float32Array(nx*ny*3);

  const terMat=new THREE.ShaderMaterial({
    uniforms:{ lysF:{value:new THREE.Color('rgb(128,180,136)')}, skyggeF:{value:new THREE.Color('rgb(92,142,108)')} },
    vertexShader:`varying vec3 vn; varying vec3 wp; varying float ny; void main(){ vec4 w=modelMatrix*vec4(position,1.); wp=w.xyz; vn=normalize(normalMatrix*normal); ny=normal.y; gl_Position=projectionMatrix*viewMatrix*w; }`,

// ---- Sola finner byen (28.10, Vegar: «A») ----
// Introen starter overskyet: tegningens to toner, ingen kastskygger, litt kjøligere. Mens kameraet svinger inn, vandrer en solkant
// over byen fra solsiden (høye punkter først), kastskyggene vokser fram der kanten har passert, og sola synker fra 58° til de
// godkjente 42° (23.10), så skyggene blir lange idet kameraet lander. Lyset er bundet til kameraets vei (bearing), ikke til klokka
// (teknikk 12): stopper du introen, henter solkanten seg inn på 0,8 s. ?solintro=0 hopper over det hele.
const SOLINTRO = SOL_FAST && !Q0.get('sol') && Q0.get('solintro')!=='0' && !Q.get('skip');   // ?solintro=0 gir den gamle introen med fast sol
const solVei={ v0:0, v1:0, u:0, ferdig:!SOLINTRO, tHent:0 };
function solStart(){
  // kanten vandrer langs solas horisontale retning: solsiden av byen først
  const ca=Math.cos(42*GRAD); U_SOL.dir.value.set(Math.sin(250*GRAD)*ca, 0, -Math.cos(250*GRAD)*ca).normalize();
  let lo=1e9, hi=-1e9; buildings.forEach(g=>{ const r=g.userData.b.r; const v=r[0]*U_SOL.dir.value.x+(-r[1])*U_SOL.dir.value.z; lo=Math.min(lo,v); hi=Math.max(hi,v); });
  solVei.v0=hi+U_SOL.bredde.value+40; solVei.v1=lo-U_SOL.bredde.value-40;   // fra «ingenting lyst» til «alt lyst», litt utenfor byen i begge ender
  U_SOL.ute.value=0; U_SOL.front.value=solVei.v0; setSol(250*GRAD, 58*GRAD);
}
function solTil(u){   // u 0..1 langs kameraets vei
  // kameraets u har alt glid-kurven i seg (80 % av svingen skjer på det midterste sekundet), så kanten følger u rett fram over hele veien;
  // en kurve til oppå gjorde at sola var over byen på 0,6 s (målt i Vegars Chrome 28.10 kl. 16.30)
  const k=THREE.MathUtils.clamp(u/0.97, 0, 1);
  U_SOL.front.value=solVei.v0+(solVei.v1-solVei.v0)*k;
  setSol(250*GRAD, (58-16*k)*GRAD);
  if(k>=1 && u>=0.999){ U_SOL.ute.value=1; U_SOL.front.value=-1e6; solVei.ferdig=true; }
}
// u = hvor langt kameraet har kommet langs introveien, lest av kartets bearing uansett hjemmevisning (AZ0 er 200/290 fra v33, ikke 40):
// avstanden fra startvinkelen, målt den korte veien rundt, delt på sveipet. Før 28.10 kl. 16 ble u regnet med fortegn fra plakatvinkelen
// og ble 1 fra første bilde i den nye hjemmevisningen, så sola stod ferdig hele introen (Vegar: «ingen effekt når jeg starter introen»).
function introU(){ const b0=-(AZ0_GRADER+SVEIP); let d=((map.getBearing()-b0)%360+540)%360-180; return THREE.MathUtils.clamp(Math.abs(d)/SVEIP,0,1); }
function solOppdater(dt){
  if(solVei.ferdig) return;
  if(!introDone){ if(!introStartet) return; solVei.u=introU(); solTil(solVei.u); }
  else { solVei.u=Math.min(1, solVei.u+dt/0.8); solTil(solVei.u); if(solVei.u>=1) solTil(1); }   // introen ble avbrutt: hent inn resten
  skyggeSkitten=true;
}
// miniatyr-uskarpheten i introen glir ut i takt med kameraet (samme kurve), i stedet for å hoppe fra 1 til 0 når introen er ferdig
// (Vegar 28.10: «ytterkantene er blury helt til introen er ferdig, og da blir alt skarpt samtidig»). Uten solintro: ut over de siste 40 %.
let tiltU=0;
// tiltU låses til maks først etter at introen har satt startvinkelen (introStartet): før det står kartet i hjemmevisningen og introU() er 1
let introStartet=false;
// avbrutt intro (29.10, oppdrag 15): før ble tiltU satt til 1 i bildet etter avbruddet, så uskarpheten forsvant på ett bilde (målt i
// flyt-test: hopp 0,78 i ett bilde). Nå tones den ut fra der den stod, på samme tid som lyset hentes inn (BEV.hentInn), med myk kurve.
const tiltAv={b0:null, s:0}; let introKjort=false;   // introKjort: introen har faktisk startet (ikke ?skip eller testkrokene)
function introTiltKurve(){ return 1-glid(THREE.MathUtils.clamp((tiltU-0.35)/0.55,0,1)); }
function tiltOppdater(dt){ if(!introStartet) return; if(!introDone){ tiltU=Math.max(tiltU, introU()); return; }
  if(tiltAv.b0===null) tiltAv.b0 = (tiltU>=1 || !introKjort) ? 0 : introTiltKurve(); tiltAv.s=Math.min(1, tiltAv.s+dt/BEV.hentInn); }
function introTilt(){ if(!introStartet) return 1; if(!introDone) return introTiltKurve(); return tiltAv.b0===null ? (introKjort ? introTiltKurve() : 0) : tiltAv.b0*(1-myk(tiltAv.s)); }
window.__solvei=()=>({u:solVei.u, front:U_SOL.front.value, ute:U_SOL.ute.value, ferdig:solVei.ferdig, tilt:introTilt()});
window.__introStill=u=>{ window.__vis(AZ0_GRADER+SVEIP*(1-u), Z0+(1-Z0)*u, START[0], START[1]); window.__solTil(u); };   // kamera + lys ved u langs introveien
window.__solTil=u=>{ if(solVei.v0===0) solStart(); solVei.ferdig=true; U_SOL.ute.value=0; solTil(u); if(u>=1){ U_SOL.ute.value=1; U_SOL.front.value=-1e6; } skyggeSkitten=true; map.triggerRepaint(); };   // stillbilder av introlyset (verktoy/sol-intro-stills.mjs); u 0..1
map.on('movestart', e=>{ if(e.originalEvent) overta(); });

// husets løft og vekst: egne grupper (kirka, portbygg, bygg med deler) flyttes som objekter; alle andre ligger i de sammenslåtte nettene og styres per bygg via hus-teksturen (05_bygg)
function husTil(g){ if(!g.userData.spesiell) settHus(g.userData.i, g.position.y, g.scale.y); }
// tilstand per bilde: vekst, hus som løfter seg, sol/skygge, tegnekvalitet
const _sisteProj=new THREE.Matrix4();
function oppdater(){
  maalYtelse();
  const naa=performance.now(), dt=Math.min(0.1,(naa-sisteTid)/1000); sisteTid=naa;
  const t=Q.get('t')?+Q.get('t'):clock.getElapsedTime();
  waterMat.uniforms.t.value=t;
  if(!vokst) vokse(t*VEKST_FART+0.45);
  anim=map.isMoving();
  // løftet hus (valgt) og svakt løftet hus (pekeren over), uavhengig av bildefrekvens
  const kl=1-Math.exp(-dt*11);
  husBeveger=!vokst;
  // skyggekartet tegnes på nytt bare mens et hus flytter seg merkbart (over 2 cm per bilde); halen av glidningen synes ikke i skyggen
  buildings.forEach(g=>{ const ty=g.userData.lift?3:(g===hover?0.9:0); const dy=(ty-g.position.y)*kl; if(Math.abs(dy)>1e-3){ g.position.y+=dy; husTil(g); husBeveger=true; if(Math.abs(dy)>0.02) skyggeSkitten=true; } });
  if(!introDone) skyggeSkitten=true;
  solOppdater(dt); tiltOppdater(dt);
  oppdaterSol();
  U_SKRAVUR.value = STIL.skravur ? kam.mpp*5*innerWidth/renderer.domElement.width*renderer.getPixelRatio() : 0;   // skravur: 5 skjermpunkter mellom strekene
  // én kvalitet: oppløsning, hjørneskygge og strek er de samme i fart og i ro (se 00_oppsett). «stille» styrer bare speilet i vannet.
  const kamFlytt = !_sisteProj.equals(cam.projectionMatrix); _sisteProj.copy(cam.projectionMatrix);
  if(kamFlytt || anim || !introDone) sistBeveg=naa;
  const stille = naa-sistBeveg>300;
  post.settSkala(skalaStille); post.setAO(aoStille); post.setSS(ssStille);
  // speilet (29.10): toner inn én gang etter introen og blir stående. I fart tegnes det på nytt høyst hvert BEV.speilMs ms; mellom gangene
  // flyttes det med kameraet (reflPV, 14/03). Før tonet det ut ved hver bevegelse og inn igjen 0,3 s etter stopp (synlig ny tegning).
  if(introDone){ speilInn=Math.min(1,speilInn+dt*2.8);
    if(stille){ speil.render(husBeveger || !speilFrisk); speilFrisk=true; }
    else { speilFrisk=false; if(naa-(speil.sist||0) >= BEV.speilMs*(perfNivaa>=2?2:1)) speil.render(true); } }
  waterMat.uniforms.reflStyrke.value=speilStyrke()*speilInn;
  sistTegnet=naa; fullTegnet=stille && !husBeveger;
  dbgTegn(naa);
}
// laget: kartet tegner byen gjennom dette. ?tegn=0 (bare flyt-test): kameraet og tilstanden oppdateres hvert bilde, men byen tegnes ikke,
// så kamerabanen kan måles bilde for bilde uten å vente på programvare-GPU-en
const TEGN = Q0.get('tegn')!=='0';
const byLag={ id:'byen', type:'custom', renderingMode:'3d',
  onAdd(){ post.size(); speil.size(); },
  render(gl,args){ window.__vaareBilder++; const t0=performance.now(); window.__mellom=t0-(window.__slutt||t0); kameraFraKartet(args); renderer.resetState(); gl.depthRange(0,1); oppdater(); if(TEGN) post.render(); window.__slutt=performance.now(); window.__ramme=window.__slutt-t0; if(!_synlig){ _synlig=true; requestAnimationFrame(()=>map.getCanvas().style.opacity=1); } } };
// ber kartet tegne på nytt når noe beveger seg; i ro tegnes det 10 ganger i sekundet (vannet lever)
// (29.10) også mens en avbrutt intro henter inn lys og uskarphet: før gikk det med 10 bilder/s når kartet stod, så uskarpheten
// tonet ut i trapper (flyt-test: samme verdi i 8 bilder, så et sprang på 0,33)
function puls(){ const naa=performance.now(); if(!vokst || !introDone || husBeveger || map.isMoving() || !solVei.ferdig || (tiltAv.b0>0 && tiltAv.s<1) || naa-sistTegnet>100) map.triggerRepaint(); requestAnimationFrame(puls); }
// teller kartets egne bilder mot våre: tegner kartet et bilde uten å kalle laget vårt, blir det et papirfarget blink
window.__kartBilder=0; window.__vaareBilder=0; map.on('render', ()=>{ window.__kartBilder++; });
map.on('load', ()=>{
  map.addLayer(byLag);
  kobleSol(); if(SOLINTRO) solStart();
  if(Q.get('skip')){ introStartet=true; introDone=true; vokst=true; buildings.forEach(g=>{ g.scale.y=1; husTil(g); }); setCrowns(null); map.jumpTo({...hjemVisning(), bearing: Q.get('az')?-(+Q.get('az')):-AZ0_GRADER, zoom: Q.get('zoom')?zoomFor(+Q.get('zoom')):Z_HJEM}); }
  else startIntro();
  puls();
});
// testkroker (skjermbilder uten ny sidelasting)
window.__skjerm=(x,z)=>{ const v=new THREE.Vector3(x,0,z).project(cam); return [(v.x+1)/2*innerWidth, (1-v.y)/2*innerHeight]; };
window.__kam=()=>{ const v=vinkler(); let vs=null; if(valgt){ const c=husBoks(valgt).getCenter(new THREE.Vector3()); vs=window.__skjerm(c.x,c.z); } return {x:kam.senter.x,z:kam.senter.z,zoom:kam.zoomfaktor,az:v.az,pol:v.pol,anim:map.isMoving(),valgt:vs,intro:!introDone,t:clock.getElapsedTime(),oye:kam.oye.toArray(), naer:kam.naer, fjern:kam.fjern, fov:kam.fov, mpp:kam.mpp}; };
window.__vis=(az,zoom,tx,ty)=>{ introStartet=true; introDone=true; vokst=true; buildings.forEach(g=>{ g.scale.y=1; husTil(g); }); setCrowns(null); map.jumpTo({center: tilLngLat(tx,ty), zoom: zoomFor(zoom), bearing: -az, pitch: PITCH0}); };
window.__kontakt=v=>{ kontaktMat.uniforms.styrke.value=v; map.triggerRepaint(); };   // regel 12: av/på i samme økt, samme kamera og skyggekart
window.__scene=()=>({scene, city});
window.__speil=()=>({styrke:waterMat.uniforms.reflStyrke.value, maal:introDone?speilStyrke():0, alder:performance.now()-(speil.sist||0)});   // flyt-test: speilet i fart   // feilsøk: tell objekter i scenen (verktoy/tell.mjs)
window.__kval=()=>({skala:post.skala(), ao:aoStille, ss:ssStille, perfNivaa, stille:performance.now()-sistBeveg>300, beveger:map.isMoving()});
window.__skjerm3=(x,y,z)=>{ const v=new THREE.Vector3(x,y,z).project(cam); return [(v.x+1)/2*innerWidth, (1-v.y)/2*innerHeight]; };

// ---- klikk, peker, huskort, hjem, styreflate og feilsøking. Dra, klyp, vri, vipp og hjul er MapLibres egne; dobbeltklikk er vårt. ----
const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2(); let valgt=null, hover=null;
const kort=document.getElementById('kort');
// adresser og virksomheter per bygg, slått opp på byggets faste id (data/adresser.json, data/virksomheter.json; verktoy/adresser.py)
const perBygg=liste=>{ const m=new Map(); (liste||[]).forEach(x=>{ if(x.skjul) return; if(!m.has(x.bygg_id)) m.set(x.bygg_id,[]); m.get(x.bygg_id).push(x); }); return m; };
const ADRESSER=perBygg(DATA.adresser), VIRKSOMHETER=perBygg(DATA.virksomheter); const hjem=document.getElementById('hjem');
// treff: strålen mot alt i byen; i de sammenslåtte nettene gir trekantnummeret hvilket bygg som ble truffet (husDeler, 07)
function byggFraTreff(hit){
  if(hit.object.isInstancedMesh && hit.object.geometry.getAttribute('aBygg')){ const k=hit.object.geometry.getAttribute('aBygg').getX(hit.instanceId)-1; return k>=0 ? buildings.find(g=>g.userData.i===k) : null; }
  const f=hit.faceIndex*3;
  for(const [i,deler] of husDeler){ for(const d of deler){ if(d.mesh===hit.object && f>=d.start && f<d.start+d.antall) return buildings.find(g=>g.userData.i===i); } }
  let g=hit.object; while(g.parent && g.parent!==city) g=g.parent; return g.parent===city && g.userData && g.userData.b ? g : null;
}
function treffHus(x,y){ ptr.set(x/innerWidth*2-1, -(y/innerHeight)*2+1); ray.setFromCamera(ptr,cam);
  const hit=ray.intersectObjects(city.children,true).find(h=>h.object.isMesh); if(!hit) return null;
  const g=byggFraTreff(hit); return g ? {g, p:hit.point} : null; }
// bygget som boks (til kamera og kort): egne grupper måles, sammenslåtte bygg regnes ut fra grunnrisset og høyden
function husBoks(g){ if(g.userData.spesiell || !g.userData.b || !g.userData.b.p) return new THREE.Box3().setFromObject(g);
  const bb=new THREE.Box3(); g.userData.b.p.forEach(([x,y])=>{ bb.expandByPoint(new THREE.Vector3(x,0,-y)); bb.expandByPoint(new THREE.Vector3(x,g.userData.h+g.position.y,-y)); }); return bb; }
// ---- huskortet (oppdrag 15, 29.10): klikk -> huset løfter seg og kameraet glir inn, kortet glir inn (mobil: bunnark fra bunnen, som
// Apple/Google Maps; bred skjerm: sidepanel fra venstre). Tilbake (×, Esc, trykk utenfor, nettleserens/Androids tilbake) går samme vei ut:
// kortet glir ut, og kameraet glir tilbake dit det stod, så lenge du ikke har flyttet kartet selv i mellomtida. Varighet og kurver: 15_bevegelse.
const kortInnhold=kort.querySelector('.innhold');
const kort_={apent:false, forKamera:null, egenFlytt:false, historikk:false};
const SIDEPANEL=window.matchMedia('(min-width: 720px)');
const kameraNaa=()=>({center:map.getCenter(), zoom:map.getZoom(), bearing:map.getBearing(), pitch:map.getPitch()});
function fyllKort(b){
  const adr=(ADRESSER.get(b.id)||[]).map(a=>a.adresse), her=VIRKSOMHETER.get(b.id)||[];
  kort.querySelector('h2').textContent = b.navn || adr[0] || b.adr || 'Bygg i Gamlebyen';
  kort.querySelector('.a').textContent = (b.navn ? adr.join(', ') : adr.slice(1).join(', ')) || b.adr || (b.tekst ? 'Fra kartbrosjyren til Visit Fredrikstad (2015)' : ''); // OSM-typen (engelsk, f.eks. «office») vises ikke
  kort.querySelector('.b').textContent = b.tekst || '';   // tomt kort fremfor plassholder: det som vises, er ferdig (27.10)
  const hl=kort.querySelector('.her'); hl.innerHTML=''; her.forEach(v=>{ const li=document.createElement('li'); li.textContent=v.navn; hl.appendChild(li); });
  const m=b.matrikkel&&b.matrikkel[0];   // statens nøkkel (Matrikkelen): bygningsnummer og kulturminne
  kort.querySelector('.id').textContent = m ? `Bygningsnr. ${m.bygningsnummer}${b.matrikkel.some(x=>x.kulturminne)?' • Kulturminne':''}` : '';
  const f=kort.querySelector('.farge'); f.innerHTML='';
  if(b.vegg){ f.innerHTML += `<i style="background:rgb(${b.vegg})"></i>Godkjent fasadefarge`; }
}
// den delen av skjermen kortet ikke dekker (layoutmål uten transform, så det gjelder også mens kortet glir inn)
function friFlate(){
  if(!kort_.apent) return {x0:0, y0:0, x1:innerWidth, y1:innerHeight};
  if(SIDEPANEL.matches) return {x0:kort.offsetLeft+kort.offsetWidth+16, y0:0, x1:innerWidth, y1:innerHeight};
  return {x0:0, y0:0, x1:innerWidth, y1:Math.max(innerHeight*0.35, kort.offsetTop-12)};
}
// kameraet glir inn mot huset: midt i den frie flaten, minst husZoom nær (aldri ut). Står huset alt der, står kameraet stille.
function glidTilHus(g){
  const c=husBoks(g).getCenter(new THREE.Vector3()); const ll=tilLngLat(c.x,-c.z);
  const fri=friFlate(), mx=(fri.x0+fri.x1)/2, my=(fri.y0+fri.y1)/2;
  const zoom=Math.max(map.getZoom(), zoomFor(BEV.husZoom)); const s=map.project(ll);
  if(Math.hypot(s.x-mx, s.y-my) < 0.12*Math.min(fri.x1-fri.x0, fri.y1-fri.y0) && zoom-map.getZoom()<0.05) return;
  glidKamera({center:ll, zoom, offset:[mx-innerWidth/2, my-innerHeight/2]}, 'hus');
}
function velgHus(g){
  if(valgt===g) return;
  if(valgt) valgt.userData.lift=false;
  valgt=g; g.userData.lift=true;
  if(!kort_.apent){ kort_.forKamera=kameraNaa(); kort_.egenFlytt=false; fyllKort(g.userData.b); visKort(true); }
  else { fyllKort(g.userData.b); kortInnhold.animate([{opacity:0},{opacity:1}], {duration:BEV.kort.innhold, easing:'ease-out'}); }   // nytt hus i åpent kort: innholdet tones over, kortet står
  glidTilHus(g);
}
function visKort(vis){
  kort_.apent=vis; kort.style.transform='';
  kort.classList.toggle('vis', vis); kort.setAttribute('aria-hidden', vis?'false':'true');
  if(vis && !kort_.historikk){ try{ window.history.pushState({...(window.history.state||{}), kort:1}, ''); kort_.historikk=true; }catch(e){ /* innebygd uten historikk */ } }
}
// lukk: tilbake=true glir kameraet tilbake dit det stod før kortet (om du ikke har flyttet kartet selv); fraHistorikk: nettleserens tilbake
function lukkKort({tilbake=true, fraHistorikk=false}={}){
  if(valgt){ valgt.userData.lift=false; valgt=null; }
  if(!kort_.apent) return;
  visKort(false);
  if(tilbake && kort_.forKamera && !kort_.egenFlytt) glidKamera(kort_.forKamera, 'tilbake');
  kort_.forKamera=null;
  if(kort_.historikk){ kort_.historikk=false; if(!fraHistorikk){ try{ window.history.back(); }catch(e){ /* innebygd */ } } }
}
kort.addEventListener('transitionend', ()=>{ kort.style.transitionDuration=''; });   // farten fra et fingerkast gjelder bare den ene overgangen
addEventListener('popstate', ()=>{ if(kort_.apent){ kort_.historikk=false; lukkKort({fraHistorikk:true}); } });
// flytter du kartet selv mens kortet er åpent, blir kameraet der du la det når kortet lukkes (som Apple og Google Maps)
map.on('movestart', e=>{ if(e.originalEvent && kort_.apent) kort_.egenFlytt=true; });
function hjemNaa(){ lukkKort({tilbake:false}); glidKamera({...hjemVisning(), offset:[0,0]}, 'hjem'); }
hjem.onclick=()=>{ overta(); hjemNaa(); }; window.__hjem=()=>{ overta(); hjemNaa(); };
// Esc: lukker kortet først (samme vei ut), neste Esc går hjem
addEventListener('keydown',e=>{ if(e.key==='Escape'){ overta(); if(kort_.apent) lukkKort(); else hjemNaa(); } });
kort.querySelector('.lukk').onclick=()=>lukkKort();
// ---- klikk og trykk: ett klikk på et hus velger det med en gang; to klikk/trykk innen 300 ms zoomer inn mot punktet (shift = ut).
// Vi gjenkjenner dobbeltklikk selv fra klikkene, så det virker likt med mus og finger (MapLibres dobbeltklikk-zoom er av, se under).
// Klikk utenfor et hus lukker kortet, men først når det ikke kom et klikk til (ellers ville et dobbeltklikk lukke og zoome samtidig).
const klikk={t:-1e9, x:0, y:0}; let lukkTimer=null;
map.on('click', e=>{ if(!introDone) return;
  const naa=performance.now(), p=e.point;
  const dobbel = naa-klikk.t < BEV.dobbelVindu && Math.hypot(p.x-klikk.x, p.y-klikk.y) < BEV.dobbelAvstand;
  if(dobbel){ klikk.t=-1e9; clearTimeout(lukkTimer); overta(); glidKamera({zoom: map.getZoom()+(e.originalEvent.shiftKey?-1:1), around:e.lngLat}, 'dobbel'); return; }
  klikk.t=naa; klikk.x=p.x; klikk.y=p.y;
  const h=treffHus(p.x,p.y);
  if(h) velgHus(h.g); else if(kort_.apent){ clearTimeout(lukkTimer); lukkTimer=setTimeout(()=>lukkKort(), BEV.dobbelVindu); }
});
// MapLibres dobbeltklikk/dobbelttrykk (300 ms, bråstopp) er av; vår glir på 800 ms med glid (regel 11)
map.doubleClickZoom.disable();
// ---- bunnarket på mobil: dra kortet ned for å lukke. Kortet følger fingeren; slippes det, regnes hvor det ville endt med farten
// (Apple, «Designing Fluid Interfaces»: prosjiser endepunktet), og det glir videre ned eller tilbake med farten det hadde.
const ark={id:null, y0:0, dy:0, spor:[]};
kort.addEventListener('pointerdown', e=>{ if(SIDEPANEL.matches || !kort_.apent || e.target.closest('button,a') || e.button>0) return;
  ark.id=e.pointerId; ark.y0=e.clientY; ark.dy=0; ark.spor=[[performance.now(), e.clientY]]; kort.setPointerCapture(e.pointerId); kort.style.transition='none'; });

// styreflate på Mac: to fingre flytter kartet (som Apple og Google Maps), klyp zoomer (ctrl+hjul), et musehjul zoomer.
// Én gest er én ting: første hendelse avgjør, hendelser innen 120 ms arver valget.
const gest={t:0,hjul:false};
map.getCanvasContainer().addEventListener('wheel', e=>{
  if(e.ctrlKey || e.metaKey) return;                      // klyp på styreflaten (ctrl) eller ⌘ og rull (Magic Mouse) = zoom, MapLibre tar den
  const naa=performance.now();
  let hjul = e.deltaMode!==0 || (e.deltaX===0 && e.wheelDeltaY && e.wheelDeltaY%120===0 && e.wheelDeltaY!==-3*e.deltaY);
  if(gest.t && naa-gest.t<120) hjul=gest.hjul;
  gest.t=naa; gest.hjul=hjul; dbgLogg(e,hjul);
  if(hjul){                                               // musehjul = zoom, jevn (15_bevegelse: hjulZoom), ikke MapLibres utslag per hakk
    e.preventDefault(); e.stopImmediatePropagation(); if(kort_.apent) kort_.egenFlytt=true;
    const px = e.deltaMode===1 ? e.deltaY*40 : e.deltaMode===2 ? e.deltaY*800 : e.deltaY;   // linjer/sider til piksler; ett hakk ≈ 100 px
    hjulZoom.hakk(e, -px/100*BEV.hjul.perHakk); return; }
  e.preventDefault(); e.stopImmediatePropagation(); overta();
  map.panBy([e.deltaX, e.deltaY], {animate:false});       // innholdet følger fingrene

  else if(fart.i){ fart.i=false; const ms=naa-fart.t0, n=fart.n; if(ms>150) fart.sist=`siste bevegelse ${ms|0} ms, ${n} bilder = ${(n*1000/ms).toFixed(0)}/s  (snitt per bilde: 3D ${(fart.s/n).toFixed(0)} ms, blekk ${(fart.b/n).toFixed(0)} ms, fxaa ${(fart.f/n).toFixed(0)} ms, skyggekart i ${fart.sk} av ${n}, hele render() ${(fart.r/n).toFixed(0)} ms, mellom bildene ${(fart.m/n).toFixed(0)} ms, kartet tegnet ${window.__kartBilder-fart.k0} bilder, laget vårt ${window.__vaareBilder-fart.v0}${pt.maal?', GPU-målt':', CPU-målt, tast m for GPU'})`; }
  const glFeil=gl2.getError();

    +String.fromCharCode(10)+fart.sist
    +String.fromCharCode(10)+`3D ${pt.scene|0} ms  blekk ${pt.blekk|0} ms  fxaa ${pt.fxaa|0} ms  kall ${pt.kall}  tri ${pt.tri}  skyggekart ${pt.skygge} (grunner: ${JSON.stringify(dekning.grunner)})  ${pt.maal?'GPU-målt':'CPU-målt'}`+String.fromCharCode(10)+`peker: ned ${dbg.pek.ned} flytt ${dbg.pek.flytt} opp ${dbg.pek.opp}  sist ${dbg.pek.sist}  knapper ${dbg.pek.knapper} ${dbg.pek.type}  senter ${tilModell(map.getCenter()).map(v=>v.toFixed(0)).join(',')}  dragPan ${map.dragPan.isEnabled()?'på':'av'} aktiv ${map.dragPan.isActive()?'ja':'nei'}`+String.fromCharCode(10)+dbg.rader.join(String.fromCharCode(10)); }
addEventListener('keydown',e=>{ if(!dbg.paa) return; if(e.key==='s'){ ssStille=ssStille===4?2:ssStille===2?1:4; } if(e.key==='a'){ aoStille=aoStille===14?7:aoStille===7?0:14; } if(e.key==='x'){ skalaStille=skalaStille===1?0.75:1; } if(e.key==='p'){ speil.av(); } if(e.key==='m'){ window.__maal=!window.__maal; } if(e.key==='n'){ post.msaa(post.samples()?0:2); } });
function dbgVeksle(){ dbg.paa=!dbg.paa; if(!dbg.el){ dbg.el=document.createElement('pre'); dbg.el.style.cssText='position:fixed;left:8px;top:8px;z-index:9;margin:0;padding:8px;font:11px/1.25 ui-monospace,monospace;background:rgba(255,255,255,.92);color:#222;max-height:92vh;overflow:hidden;pointer-events:none;border-radius:6px'; document.body.appendChild(dbg.el); } dbg.el.style.display=dbg.paa?'block':'none'; }

// ---- bakkeflater og parkering (27.10): plenene (OSM, rettet mot ortofoto 2024), gresset i gårdsrommene slik ortofotoet viser det,
// flatene målt i ortofotoet (grus, heller, asfalt) og parkeringsplassene fra kommunens lag. Flate farger, tynn strek fra
// etterbehandlingen (høydesprang mellom flatene), ingen tekst på bakken. Skjulte objekter (rettelse «skjul») tegnes ikke.
{
  // én flat farge med svak flekk i stor skala, som plenene; tar kastskygge
  const flateMat=(rgb)=>medSkygge(new THREE.ShaderMaterial({
    uniforms:{ c1:{value:new THREE.Color(`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`)} },
    vertexShader:`varying vec3 wp; void main(){ vec4 w=modelMatrix*vec4(position,1.); wp=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader:`uniform vec3 c1; varying vec3 wp;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      void main(){ float m=n(wp.xz*0.03)*0.6+n(wp.xz*0.12)*0.4; gl_FragColor=vec4(c1*(0.95+0.08*m),1.);
      #include <colorspace_fragment>
      }`
  }));
  // bed (bar jord) og brostein utenfor brosteinsflaten kommer fra ortofotoet (verktoy/bakke.py overflater, 29.10)
  const FARGE={ grus:[214,204,182], heller:[190,184,174], asfalt:[150,146,140], gress:[126,180,134], parkering:[160,157,152], bed:[132,108,86], brostein:[146,140,132] };
  const MAT={brostein:stoneMat}; const matFor=k=>MAT[k]||(MAT[k]=flateMat(FARGE[k]));
  // flaten legges på terrenget (vollene og kaiene ligger på terrengnettet), aldri lavere enn y0
  const legg=(pts, y0, mat)=>{
    if(!pts || pts.length<3) return null;
    const g=new THREE.ShapeGeometry(polyShape(pts)); g.rotateX(-Math.PI/2);
    const P=g.attributes.position; for(let i=0;i<P.count;i++) P.setY(i, Math.max(y0, hAt(P.getX(i), -P.getZ(i))+y0));
    P.needsUpdate=true; g.computeVertexNormals();
    const m=new THREE.Mesh(g, mat); m.receiveShadow=true; scene.add(m); return m;
  };
  // plenene (flyttet hit fra 04)
  DATA.gront.forEach(g=>{ if(!g.skjul) flat(g.p,0.28,plenMat); });
  // gårdsrommene: målt gress (felt «gress») tegnes som polygoner; uten måling gjelder typen for hele gårdsrommet
  (DATA.gardsrom||[]).forEach(g=>{ if(g.skjul) return;
    if(g.gress) g.gress.forEach(p=>flat(p,0.3,plenMat)); else if(g.typ==='gress') flat(g.p,0.3,plenMat); });
  // flater målt i ortofotoet
  (DATA.flater||[]).forEach(f=>{ if(!f.skjul && FARGE[f.typ]) legg(f.p, f.typ==='gress'?0.28:0.09, f.typ==='gress'?plenMat:matFor(f.typ)); });
  // oppmerkede parkeringsfelt (kommunens lag, verktoy/bakke.py parkeringsfelt): hvite streker på tvers av raden, oppmerket+1 stk
  { const strek=new THREE.MeshBasicMaterial({color:0xf4f2ec}); const G=new THREE.Group(); scene.add(G);
    (DATA.flater||[]).forEach(f=>{ if(f.skjul || !f.linje || !f.oppmerket) return;
      const [a,c]=f.linje, dx=c[0]-a[0], dy=c[1]-a[1], L=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
      for(let i=0;i<=f.oppmerket;i++){ const t=i/f.oppmerket, x=a[0]+dx*t, y=a[1]+dy*t;
        const m=new THREE.Mesh(new THREE.PlaneGeometry(0.12, f.bredde*0.9), strek); m.rotation.x=-Math.PI/2; m.rotation.z=ang;
        m.position.set(x, hAt(x,y)+0.14, -y); G.add(m); } });
    flatGruppe(G); }
  // parkering: bare plasser med målt flate; punktene (uten flate) finnes i dataene, men tegnes ikke på bakken
  (DATA.parkering||[]).forEach(p=>{ if(!p.skjul && p.p) legg(p.p, 0.12, matFor('parkering')); });
}

// ---- brygger (27.10): fergeleiet, gjestebrygga i Toldbodgaten, Isegran og båtplassene langs Glomma, fra data/brygger.json
// (verktoy/brygger.py: OSM rettet mot ortofoto 2024 og målt for hånd). Husstilen som broene: treplanker i flat farge med mørke
// skjøter på tvers, blekkstreken kommer fra etterbehandlingen. Faste brygger står på stolper ca. 1 m over vannet, flytebrygger
// ligger lavt (ca. 0,4 m) som en ponton uten stolper, utriggerne er smale bommer på vannet. Bryggene kaster skygge og står
// oppå vannflaten (y = 0,15); vannets skum ligger under dem. Et mykt mørke på vannet rundt hver brygge (kontaktskyggen fra
// husene) gir skyggen der vannet selv ikke tar kastskygge. Skjulte brygger (rettelse «skjul») tegnes ikke.
{
  const VANN_Y=0.15, PLANKE=0.9, STOLPE_AVSTAND=2.6;
  const FARGE={ tre:[[150,112,78],[96,70,48]], metall:[[168,170,168],[92,94,96]], plast:[[218,186,78],[140,112,40]] };
  const T_DEKK={ fast:0.28, flytebrygge:0.42, utrigger:0.32 };   // dekket for faste brygger; flytebrygga og bommen er pontonen helt ned i vannet
  const g=new THREE.Group(); g.name='brygger';
  const mork=f=>mat((FARGE[f]||FARGE.tre)[1],false), lys=f=>mat((FARGE[f]||FARGE.tre)[0],false);
  // én kloss (lengde langs retningen v i modellplanet), sentrert i (x,y), mellom høydene y0 og y1
  const kloss=(x,y,v,lengde,bredde,y0,y1,m)=>{ const k=new THREE.Mesh(new THREE.BoxGeometry(lengde,y1-y0,bredde),m);
    k.position.set(x,(y0+y1)/2,-y); k.rotation.y=v; k.castShadow=k.receiveShadow=true; g.add(k); return k; };
  const kontakt={pos:[], alfa:[]};
  (DATA.brygger||[]).forEach(b=>{
    if(b.skjul || !b.p || b.p.length<3) return;
    const topp=VANN_Y+b.z, t=b.typ==='fast' ? T_DEKK.fast : topp-VANN_Y+0.1, bunn=topp-t;
    // dekket (fast) eller pontonen (flytebrygge, utrigger): omrisset ekstrudert, plant oppå
    const geo=new THREE.ExtrudeGeometry(polyShape(b.p),{depth:t, bevelEnabled:false}); geo.rotateX(-Math.PI/2);
    const dekk=new THREE.Mesh(geo, lys(b.flate)); dekk.position.y=bunn; dekk.castShadow=dekk.receiveShadow=true; g.add(dekk);
    // planker: mørke skjøter på tvers av bryggas lange side, klippet mot omrisset (tre; metall og plast er glatte)
    const a=b.retning||0, ux=Math.cos(a), uy=Math.sin(a), vx=-uy, vy=ux;
    if(b.flate==='tre' && b.typ!=='utrigger'){
      const U=b.p.map(q=>q[0]*ux+q[1]*uy), V=b.p.map(q=>q[0]*vx+q[1]*vy), n=b.p.length;
      for(let s=Math.min(...U)+PLANKE/2; s<Math.max(...U); s+=PLANKE){
        const kr=[];
        for(let i=0;i<n;i++){ const j=(i+1)%n, di=U[i]-s, dj=U[j]-s; if((di<0)!==(dj<0)) kr.push(V[i]+(V[j]-V[i])*di/(di-dj)); }
        kr.sort((p,q)=>p-q);
        for(let k=0;k+1<kr.length;k+=2){ const L=kr[k+1]-kr[k]-0.08; if(L<0.2) continue; const w=(kr[k]+kr[k+1])/2;
          kloss(s*ux+w*vx, s*uy+w*vy, Math.atan2(vy,vx), L, 0.05, topp, topp+0.015, mork(b.flate)); }
      }
    }
    // stolper under faste brygger: langs kantene, litt inn fra kanten, ned i vannet
    if(b.typ==='fast'){
      let areal=0; for(let i=0;i<b.p.length;i++){ const p=b.p[i], q=b.p[(i+1)%b.p.length]; areal+=p[0]*q[1]-q[0]*p[1]; }
      const inn=areal>0 ? 1 : -1;   // mot klokka: innsiden er til venstre for kanten
      for(let i=0;i<b.p.length;i++){ const p=b.p[i], q=b.p[(i+1)%b.p.length], dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy); if(L<0.8) continue;
        const nx=-dy/L*inn*0.16, ny=dx/L*inn*0.16, m=Math.max(1,Math.round(L/STOLPE_AVSTAND));
        for(let k=0;k<m;k++){ const f=Math.max(k/m, 0.12/L); const x=p[0]+dx*f+nx, y=p[1]+dy*f+ny;   // én stolpe i hvert hjørne og hver ~2,6 m
          kloss(x, y, Math.atan2(dy,dx), 0.2, 0.2, VANN_Y-0.3, bunn, mork(b.flate)); } }
    }
    // mørket på vannet rundt brygga (skygge og kontakt), bredere under de høye
    const f=fotBaand(b.p, b.typ==='fast' ? 1.1 : 0.55, VANN_Y+0.01); kontakt.pos.push(...f.pos); kontakt.alfa.push(...f.alfa);
  });
  flatGruppe(g); city.add(g);
  if(kontakt.pos.length){ const kg=new THREE.BufferGeometry(); kg.setAttribute('position', new THREE.Float32BufferAttribute(kontakt.pos,3)); kg.setAttribute('aAlfa', new THREE.Float32BufferAttribute(kontakt.alfa,1));
    const km=new THREE.Mesh(kg, kontaktMat); km.frustumCulled=false; km.renderOrder=1; city.add(km); }
  g.traverse(c=>c.layers.enable(1));   // speilingen i vannet (14_speilinger) tar med bryggene
}

// ---- gårdsmurer i tegl med rundbueport, glasshus (vinterhager) og granittsokkel (27.10, Kaserna etter ombyggingen; data fra verktoy/kaserna.py) ----
{
  const anlegg=new THREE.Group(); scene.add(anlegg);
  const fra=id=>DATA.bygg.find(b=>b.id===id)||{};
  // murene: tegl som huset de hører til, lys dekkstein på toppen. Porten er en høyere pilar med rundbue gjennom.
  (DATA.teglmurer||[]).forEach(mu=>{
    if(mu.skjul) return;
    const hus=fra(mu.farge_fra); const tegl=mat(hus.vegg||[200,120,100],false,hus.veggs,{ds:true}), dekk=mat([214,208,198],false,undefined,{ds:true});
    const [a,c]=mu.p; const dx=c[0]-a[0], dy=c[1]-a[1], L=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
    const del=(s0,s1)=>{ if(s1-s0<0.2) return;
      const mx=a[0]+dx*(s0+s1)/2/L, my=a[1]+dy*(s0+s1)/2/L, y0=hAt(mx,my);
      const w=new THREE.Mesh(new THREE.BoxGeometry(s1-s0,mu.h,mu.tykk),tegl); w.position.set(mx,y0+mu.h/2,-my); w.rotation.y=ang; w.castShadow=w.receiveShadow=true; anlegg.add(w);
      const k=new THREE.Mesh(new THREE.BoxGeometry(s1-s0+0.1,0.16,mu.tykk+0.16),dekk); k.position.set(mx,y0+mu.h+0.08,-my); k.rotation.y=ang; k.castShadow=true; anlegg.add(k); };
    const pt=mu.port;
    if(!pt){ del(0,L); return; }
    const sp=pt.s*L, P=pt.pilar; del(0,sp-P/2); del(sp+P/2,L);
    // portpilaren: rektangel med rundbuehull, ekstrudert gjennom muren
    const sh=new THREE.Shape(); sh.moveTo(-P/2,0); sh.lineTo(P/2,0); sh.lineTo(P/2,pt.pilar_h); sh.lineTo(-P/2,pt.pilar_h); sh.closePath();
    const r=pt.bredde/2, yb=pt.hoyde-r; const hul=new THREE.Path(); hul.moveTo(-r,0); hul.lineTo(-r,yb); hul.absarc(0,yb,r,Math.PI,0,true); hul.lineTo(r,0); hul.closePath(); sh.holes.push(hul);
    const D=mu.tykk+0.4; const eg=new THREE.ExtrudeGeometry(sh,{depth:D,bevelEnabled:false,curveSegments:16}); eg.translate(0,0,-D/2);
    const mx=a[0]+dx*pt.s, my=a[1]+dy*pt.s, y0=hAt(mx,my);
    const m=new THREE.Mesh(eg,tegl); m.position.set(mx,y0,-my); m.rotation.y=ang; m.castShadow=m.receiveShadow=true; anlegg.add(m);
    const k=new THREE.Mesh(new THREE.BoxGeometry(P+0.2,0.22,D+0.2),dekk); k.position.set(mx,y0+pt.pilar_h+0.11,-my); k.rotation.y=ang; k.castShadow=true; anlegg.add(k);
    // lys buekant (stikk) rundt åpningen på begge sider
    const bk=new THREE.Shape(); bk.absarc(0,yb,r+0.32,0,Math.PI,false); bk.lineTo(-r,yb); bk.absarc(0,yb,r,Math.PI,0,true); bk.closePath();
    [1,-1].forEach(sd=>{ const g=new THREE.Mesh(new THREE.ShapeGeometry(bk,16),dekk); g.position.set(mx,y0,-my); g.rotation.y=ang; g.translateZ(sd*(D/2+0.01)); if(sd<0) g.rotateY(Math.PI); anlegg.add(g); });
  });
  // glasshus: mørkt grønne sprosser, glass, flatt tak med lanterne (som i illustrasjonene)
  (DATA.vinterhager||[]).forEach(v=>{
    if(v.skjul) return;
    const p=v.p, H=v.h; const y0=Math.min(...p.map(q=>hAt(q[0],q[1])));
    const glass=mat([168,182,170],false,[120,132,124]), ramme=mat([52,78,60],false), tak=mat([92,112,98],false);   // lyst glass med varmt innhold bak, grønne sprosser (SG&CO-illustrasjonene)
    const sh=polyShape(p); const eg=new THREE.ExtrudeGeometry(sh,{depth:H,bevelEnabled:false}); eg.rotateX(-Math.PI/2); eg.translate(0,y0,0);
    const kropp=new THREE.Mesh(eg,[tak,glass]); kropp.castShadow=kropp.receiveShadow=true; anlegg.add(kropp);
    // sprosser: stolper hver 1,1 m langs de tre frie sidene, losholt i dørhøyde og takgesims
    const gx=p.reduce((s,q)=>s+q[0],0)/p.length, gy=p.reduce((s,q)=>s+q[1],0)/p.length;
    for(let i=1;i<p.length;i++){ const a=p[i], c=p[(i+1)%p.length];   // første kant står mot husveggen
      const dx=c[0]-a[0], dy=c[1]-a[1], L=Math.hypot(dx,dy), ang=Math.atan2(dy,dx), n=Math.max(1,Math.round(L/1.1));
      let nx=dy/L, ny=-dx/L; if(nx*((a[0]+c[0])/2-gx)+ny*((a[1]+c[1])/2-gy)<0){ nx=-nx; ny=-ny; }   // utover fra glasshusets midte
      for(let j=0;j<=n;j++){ const s=j/n; const st=new THREE.Mesh(new THREE.BoxGeometry(0.12,H,0.12),ramme); st.position.set(a[0]+dx*s+nx*0.03, y0+H/2, -(a[1]+dy*s+ny*0.03)); anlegg.add(st); }
      [2.5, H-0.12].forEach(z=>{ const b=new THREE.Mesh(new THREE.BoxGeometry(L,z>3?0.3:0.1,0.14),ramme); b.position.set((a[0]+c[0])/2+nx*0.03, y0+z, -((a[1]+c[1])/2+ny*0.03)); b.rotation.y=ang; anlegg.add(b); });
    }
    const cx=p.reduce((s,q)=>s+q[0],0)/p.length, cy=p.reduce((s,q)=>s+q[1],0)/p.length;
    const a=Math.atan2(p[1][1]-p[0][1],p[1][0]-p[0][0]), L=Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]);
    const lt=new THREE.Mesh(new THREE.BoxGeometry(L*0.45,0.45,1.8),glass); lt.position.set(cx,y0+H+0.22,-cy); lt.rotation.y=a; lt.castShadow=true; anlegg.add(lt);
  });
  // verandaer: uteservering langs fasaden som i SG&CO-kveldsbildet: lavt dekke, plantekasser langs ytterkanten med åpning
  // midt foran, parasoller med bord under (te-, verktoy/kaserna.py)
  (DATA.terrasser||[]).forEach(v=>{
    if(v.skjul) return;
    const p=v.p, y0=Math.min(...p.map(q=>hAt(q[0],q[1])));
    const dekk=mat([150,122,98],false), kasse=mat([70,58,48],false), gront=mat([86,124,72],false), duk=mat([222,214,198],false,undefined,{ds:true}), jern=mat([46,46,44],false), bord=mat([120,92,70],false);
    const eg=new THREE.ExtrudeGeometry(polyShape(p),{depth:v.h,bevelEnabled:false}); eg.rotateX(-Math.PI/2); eg.translate(0,y0,0);
    const pl=new THREE.Mesh(eg,[dekk,kasse]); pl.receiveShadow=true; anlegg.add(pl);
    const top=y0+v.h, a0=p[0], a1=p[1], ux=(a1[0]-a0[0]), uy=(a1[1]-a0[1]), L=Math.hypot(ux,uy), tx=ux/L, ty=uy/L;
    const nx=p[3][0]-p[0][0], ny=p[3][1]-p[0][1], D=Math.hypot(nx,ny), ex=nx/D, ey=ny/D, ang=Math.atan2(ty,tx);
    const P=(s,d)=>[a0[0]+tx*s+ex*d, a0[1]+ty*s+ey*d];
    // plantekasser: ytterkanten (åpning midt foran) og begge ender
    const kasseLangs=(s0,s1,d)=>{ if(s1-s0<0.3) return; const [x,y]=P((s0+s1)/2,d);
      const k=new THREE.Mesh(new THREE.BoxGeometry(s1-s0,0.55,0.5),kasse); k.position.set(x,top+0.275,-y); k.rotation.y=ang; k.castShadow=true; anlegg.add(k);
      const g=new THREE.Mesh(new THREE.BoxGeometry(s1-s0-0.1,0.35,0.42),gront); g.position.set(x,top+0.72,-y); g.rotation.y=ang; g.castShadow=true; anlegg.add(g); };
    const ap=v.aapning||2.4; kasseLangs(0,(L-ap)/2,D-0.25); kasseLangs((L+ap)/2,L,D-0.25);
    [0.25,L-0.25].forEach(s=>{ const [x,y]=P(s,(D-0.5)/2+0.2); const k=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.55,D-0.9),kasse); k.position.set(x,top+0.275,-y); k.rotation.y=ang; k.castShadow=true; anlegg.add(k);
      const g=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.35,D-1.0),gront); g.position.set(x,top+0.72,-y); g.rotation.y=ang; anlegg.add(g); });
    // parasoller med bord: jevnt fordelt langs dekket, halvveis ut
    const n=v.parasoller||4;
    for(let i=0;i<n;i++){ const [x,y]=P(L*(i+0.5)/n, D*0.52);
      const st=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,2.5,6),jern); st.position.set(x,top+1.25,-y); anlegg.add(st);
      const sk=new THREE.Mesh(new THREE.ConeGeometry(1.55,0.55,8,1,true),duk); sk.position.set(x,top+2.55,-y); sk.castShadow=true; anlegg.add(sk);
      [-0.75,0.75].forEach(o=>{ const b=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.06,10),bord); b.position.set(x+tx*o,top+0.74,-(y+ty*o)); b.castShadow=true; anlegg.add(b);
        const f=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.72,5),jern); f.position.set(x+tx*o,top+0.36,-(y+ty*o)); anlegg.add(f); });
    }
  });
  // granittsokkel: lys stein rundt foten av huset (bygg med feltet sokkel)
  DATA.bygg.forEach(b=>{
    if(!b.sokkel || b.skjul || !b.p) return;
    const stein=mat(b.sokkel.farge,false); const p=b.p;
    const A=p.reduce((s,q,i)=>{ const c=p[(i+1)%p.length]; return s+q[0]*c[1]-c[0]*q[1]; },0), sg=A<0?1:-1;   // med klokka: utover er til venstre
    for(let i=0;i<p.length;i++){ const a=p[i], c=p[(i+1)%p.length]; const dx=c[0]-a[0], dy=c[1]-a[1], L=Math.hypot(dx,dy); if(L<0.3) continue;
      const nx=-dy/L*sg, ny=dx/L*sg;   // sokkelen står 0,16 m utenfor veggen, kjellervinduene ligger foran den
      const mx=(a[0]+c[0])/2+nx*0.08, my=(a[1]+c[1])/2+ny*0.08, y0=hAt(mx,my);
      const s=new THREE.Mesh(new THREE.BoxGeometry(L+0.32,b.sokkel.h,0.16),stein); s.position.set(mx,y0+b.sokkel.h/2,-my); s.rotation.y=Math.atan2(dy,dx); s.receiveShadow=true; anlegg.add(s); }
  });
  flatGruppe(anlegg);
}

// ---- Statuer og skulpturer: Frederik II på Torvet (Wilhelm Rasmussen 1917), «Sittende pike» i Tamburparken (Arne Durban 1957/58) ----
// Alle mål, retning og plass står i data/statue.json med kilder (KILDER.md). Koden tegner bare det dataene sier:
// sokkelen er en stabel av ledd (b = bredde, d = dybde om leddet ikke er kvadratisk, b2 = bredde i toppen for skrå lister,
// stein: mørk | lys | bronse), figuren står på toppen i sin egen ramme (+z = fram, -x = figurens høyre side, y = 0 på sokkelen)
// og skaleres til figur.h. figur.form velger figuren i FIGUR (en ny form = en ny funksjon her; en ny statue med kjent form = bare data).
// Retning: kompassgrader (0 = nord, med klokka) for veien figuren ser. Poster med tegnes:false (plass ikke sikker) tegnes ikke.
(()=>{
const STEINFARGE={ 'mørk':[[66,68,72],[40,41,44]], lys:[[178,176,170],[124,122,118]], trinn:[[104,106,110],[66,67,70]], bronse:[[120,160,138],[70,98,86]] };
const PATINA=[120,160,138], PATINA_S=[70,98,86], RELIEFF=[96,128,112], GULL=[214,206,170];
const V=(a,b,c)=>new THREE.Vector3(a,b,c);
// dreid: omdreiningsflate fra profil [[radius, høyde]] (glatt rustning i stedet for sylindre), lukket topp og bunn
const dreid=(prof,n)=>{ const P=[new THREE.Vector2(0,prof[0][1]), ...prof.map(([r,y])=>new THREE.Vector2(r,y)), new THREE.Vector2(0,prof[prof.length-1][1])]; return new THREE.LatheGeometry(P,n); };
// pipekrage: skive med rillet kant (k riller), radius r, høyde h
const pipekrage=(r,h,k)=>{ const g=new THREE.CylinderGeometry(r,r*0.94,h,k*4,1); const p=g.getAttribute('position');
  for(let j=0;j<p.count;j++){ const x=p.getX(j), z=p.getZ(j), rr=Math.hypot(x,z); if(rr<1e-4) continue; const a=Math.atan2(z,x), f=1+0.09*Math.cos(a*k); p.setX(j,x*f); p.setZ(j,z*f); }
  g.computeVertexNormals(); return g; };
// figurene: får verktøyene (del, lem, kule) og returnerer modellhøyden (isse over sokkelen) som figur.h skalerer til
const FIGUR={
  // Frederik II: platerustning, kommandostav i høyre hånd, venstre hånd i siden. Målene er lest av kommunens frontfoto (kunstregisteret,
  // OBJECTID 4924) som andeler av høyden føtter–isse (kne 0,25, hoseskant 0,44, belte 0,59, skulder 0,81, hake 0,88),
  // kontrollert mot Wilse 1931 og nb.no 1969.
  rustning_stav({k,del,lem,kule}){
    [[-0.14,0.03],[0.18,-0.04]].forEach(([fx,fz])=>{
      kule(0.075,V(fx,0.045,fz+0.06),0.85,0.6,2.0);                              // jernsko (sabaton): avrundet, ikke kasse (30.10)
      lem(V(fx,0.08,fz),V(fx*0.97,0.48,fz*0.6),0.06,0.075);                     // legg
      kule(0.082,V(fx*0.95,0.51,fz*0.5+0.02));                                   // kne
      lem(V(fx*0.95,0.52,fz*0.5),V(fx*0.8,0.92,0),0.085,0.10);                  // lår
    });
    del(dreid([[0.20,0],[0.27,0.06],[0.285,0.16],[0.26,0.27],[0.225,0.32]],18),0,0.88,0).scale.set(1,1,0.78);   // pluderhoser/lårplater: buklet profil (30.10)
    del(new THREE.BoxGeometry(0.08,0.12,0.08),0,0.96,0.21);                      // skamkapsel
    del(new THREE.CylinderGeometry(0.225,0.23,0.05,24),0,1.205,0).scale.set(1,1,0.8);    // belte
    del(dreid([[0.215,0],[0.235,0.08],[0.258,0.2],[0.262,0.3],[0.245,0.37],[0.17,0.41]],20),0,1.23,0.01).scale.set(1,1,0.82); // brystharnisk: rundet bryst, smalt mot beltet (30.10)
    kule(0.105,V(-0.28,1.61,0),1,0.8,1); kule(0.105,V(0.28,1.61,0),1,0.8,1);     // skulderplater
    lem(V(-0.19,1.62,0.16),V(0.03,1.40,0.225),0.042,0.042); lem(V(0.03,1.40,0.225),V(0.23,1.18,0.15),0.042,0.042);   // bandolær
    const hode=new THREE.Group(); hode.position.set(0,1.66,0.0); hode.rotation.y=-0.26; k.add(hode);             // litt mot hans høyre
    del(new THREE.CylinderGeometry(0.06,0.07,0.12,8),0,0.0,0,hode);              // hals
    del(pipekrage(0.155,0.075,18),0,0.03,0.01,hode);                           // pipekrage: rillet kant (30.10)
    kule(0.115,V(0,0.18,0.0),0.92,1.12,1,hode);                                  // hode
    kule(0.085,V(0,0.10,0.045),1.0,1.05,0.75,hode); kule(0.05,V(0,0.055,0.085),0.95,1.25,0.8,hode);   // helskjegg: fyldig rundt kinn og hake, avrundet spiss (30.10)
    const hS=V(-0.30,1.60,0), hA=V(-0.40,1.28,0.08), hH=V(-0.55,1.52,0.2);      // høyre arm, hånda nesten i skulderhøyde
    lem(hS,hA,0.072,0.062); lem(hA,hH,0.06,0.05); kule(0.055,hH);
    lem(V(-0.64,1.64,0.2),V(-0.16,1.19,0.27),0.026,0.024);                      // staven: litt over hånda, ned mot magen
    const vS=V(0.30,1.60,0), vA=V(0.56,1.31,-0.06), vH=V(0.32,1.19,0.04);       // venstre arm i siden
    lem(vS,vA,0.072,0.062); lem(vA,vH,0.06,0.05); kule(0.055,vH);
    lem(V(0.27,1.10,0.02),V(0.29,1.28,0.1),0.016,0.016);                        // hjalt
    lem(V(0.22,1.11,0.05),V(0.34,1.11,-0.03),0.012,0.012);                      // parerstang
    lem(V(0.28,1.10,-0.01),V(0.30,0.06,-0.42),0.024,0.018);                     // slire bak venstre bein
    del(new THREE.BoxGeometry(0.1,0.18,0.06),0.31,1.0,0.09);                    // pung
    return 1.97;
  },
  // «Sittende pike»: naken jente som sitter på hælene, armene strake ned med hendene på knærne, overkroppen litt fram, hodet løftet
  // (Fredrikstad Museum-foto 1958 og kommunens foto). Modellen er 0,88 til isse.
  knelende_pike({k,del,lem,kule}){
    [-0.1,0.1].forEach(sx=>{
      lem(V(sx,0.06,0.30),V(sx*0.9,0.05,-0.12),0.055,0.045);                    // legg på sokkelen, kne fram
      kule(0.06,V(sx,0.07,0.31));                                                // kne
      lem(V(sx,0.08,0.30),V(sx*0.8,0.2,-0.06),0.065,0.085);                     // lår ned mot hælene
    });
    kule(0.15,V(0,0.2,-0.08),1.05,0.8,0.9);                                      // hofte/sete på hælene
    lem(V(0,0.22,-0.07),V(0,0.62,0.03),0.12,0.105).scale.set(1,1,0.75);          // overkropp, litt fram
    const skS=[V(-0.12,0.6,0.04),V(0.12,0.6,0.04)], hand=[V(-0.1,0.13,0.34),V(0.1,0.13,0.34)];
    [0,1].forEach(i=>{ lem(skS[i],hand[i],0.035,0.028); kule(0.032,hand[i],1,0.7,1.3); });   // strake armer, hender på knærne
    lem(V(0,0.62,0.04),V(0,0.7,0.06),0.035,0.035);                               // hals
    const hode=new THREE.Group(); hode.position.set(0,0.78,0.08); hode.rotation.set(-0.2,-0.15,0); k.add(hode);   // løftet, litt til siden
    kule(0.075,V(0,0,0),0.9,1.08,1,hode); kule(0.08,V(0,0.03,-0.015),1,0.9,1,hode);          // ansikt og hår (kort, fyldig)
    return 0.88;
  },
};
(DATA.statue||[]).filter(st=>st.tegnes!==false && st.figur && FIGUR[st.figur.form]).forEach(st=>{
  const g=new THREE.Group(); const [x,y]=st.xy;
  const M=(f,sk)=>mat(f,false,sk,{ds:true});
  const legg=(geo,f,sk,px,py,pz,forelder=g)=>{ const m=new THREE.Mesh(geo,M(f,sk)); m.position.set(px,py,pz); m.castShadow=true; m.receiveShadow=true; forelder.add(m); return m; };
  // ledd: rett blokk (b x d), eller avkortet pyramide (4 sider, dreid 45°, så sidene står rett) når b2 er gitt (bare kvadratisk)
  const ledd=(l,y0,f,sk)=> l.b2==null
    ? legg(new THREE.BoxGeometry(l.b,l.h,l.d||l.b),f,sk,0,y0+l.h/2,0)
    : (m=>{ m.rotation.y=Math.PI/4; return m; })(legg(new THREE.CylinderGeometry(l.b2/Math.SQRT2,l.b/Math.SQRT2,l.h,4,1),f,sk,0,y0+l.h/2,0));
  let y0=0, front=null;
  (st.sokkel||[]).forEach(l=>{
    const stein=l.stein || (l.del==='trinn' ? 'trinn' : l.del==='bronseplate' ? 'bronse' : 'mørk');
    const [f,sk]=STEINFARGE[stein]||STEINFARGE['mørk'];
    ledd(l,y0,f,sk);
    if(l.front) front={y0, h:l.h, d:l.d||l.b};
    y0+=l.h;
  });
  // fronten (leddet med «front» i dataene): kronet riksvåpen (relieff) over innskriften, som på Frederik II
  if(front){ const zf=front.d/2+0.012;
    const skjold=legg(new THREE.CylinderGeometry(0.15,0.15,0.03,20),RELIEFF,PATINA_S,0,front.y0+front.h*0.58,zf); skjold.rotation.x=Math.PI/2; skjold.scale.set(1,1,1.42);
    legg(new THREE.BoxGeometry(0.2,0.07,0.03),RELIEFF,PATINA_S,0,front.y0+front.h*0.58+0.25,zf);            // krona
    legg(new THREE.BoxGeometry(0.46,0.05,0.01),GULL,[150,144,116],0,front.y0+front.h*0.22,zf-0.008);          // innskriften
  }
  const k=new THREE.Group(); k.position.y=y0; g.add(k);
  const del=(geo,px,py,pz,forelder=k)=>legg(geo,PATINA,PATINA_S,px,py,pz,forelder);
  const lem=(a,b,r1,r2,forelder=k)=>{ const d=b.clone().sub(a), L=d.length(); const m=del(new THREE.CylinderGeometry(r2,r1,L,16),(a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2,forelder);
    m.quaternion.setFromUnitVectors(V(0,1,0), d.normalize()); return m; };
  const kule=(r,p,sx=1,sy=1,sz=1,forelder=k)=>{ const m=del(new THREE.SphereGeometry(r,20,14),p.x,p.y,p.z,forelder); m.scale.set(sx,sy,sz); return m; };
  const hoyde=FIGUR[st.figur.form]({k,del,lem,kule});
  k.scale.setScalar(st.figur.h/hoyde);
  // retning: kompassgrader -> rotasjon om y (lokal +z = fram); verden: x = øst, -z = nord
  const b=(st.retning||0)*Math.PI/180; g.rotation.y=Math.atan2(Math.sin(b),-Math.cos(b));
  g.scale.setScalar(st.visningsskala||1);
  g.position.set(x,0,-y); g.userData={b:{navn:st.navn,adr:st.sted||'',tekst:st.tekst}}; flatGruppe(g); city.add(g);
});
})();
