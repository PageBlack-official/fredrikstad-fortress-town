:root{--bg:#e2e1d6;--ink:#2b2420;--paper:#f6f3ea;--muted:#7a7166}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#e2e1d6;--ink:#2b2420;--paper:#f6f3ea;--muted:#7a7166}}
:root[data-theme="dark"]{--bg:#e2e1d6;--ink:#2b2420;--paper:#f6f3ea;--muted:#7a7166}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#kart{position:fixed;inset:0;background:var(--bg)}
.maplibregl-canvas{opacity:0;transition:opacity .45s ease-out;outline:none}
.maplibregl-ctrl-attrib{display:none}
:root{color-scheme:light}
#hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;letter-spacing:.02em;color:var(--ink);background:rgba(246,243,234,.82);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:normal;max-width:min(88vw,560px);text-align:center;line-height:1.45}
#hjem{z-index:4;position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;border:0;border-radius:22px;padding:10px 14px;background:rgba(246,243,234,.92);color:var(--ink);font:500 13px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;box-shadow:0 4px 16px rgba(40,30,20,.14);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity var(--t-kort-ut,240ms) var(--k-flytt,ease),transform var(--t-kort-ut,240ms) var(--k-flytt,ease)}
#hjem.vis{opacity:1;pointer-events:auto;transform:none;transition-duration:var(--t-kort-inn,380ms)}
#hjem:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* huskortet (29.10): bunnark på smal skjerm, sidepanel fra venstre på bred. Tider og kurver fra 15_bevegelse.js (--t-…, --k-…):
   inn bremser (Material emphasized decelerate), ut akselererer og er kortere. Bare transform og opacity animeres (ingen ny layout per bilde). */
#kort{z-index:5;position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:380px;margin:0 auto;background:var(--paper);border-radius:14px;padding:16px 18px;box-shadow:0 10px 30px rgba(40,30,20,.18);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform var(--t-kort-ut,240ms) var(--k-ut,cubic-bezier(.3,0,.8,.15)),visibility 0s var(--t-kort-ut,240ms);touch-action:none;will-change:transform}
#kort.vis{transform:none;visibility:visible;transition:transform var(--t-kort-inn,380ms) var(--k-inn,cubic-bezier(.05,.7,.1,1)),visibility 0s}
#kort .grep{width:36px;height:4px;border-radius:2px;background:rgba(43,36,32,.18);margin:-8px auto 10px}
@media (min-width:720px){
  #kort{left:max(16px,env(safe-area-inset-left,0px));top:calc(68px + env(safe-area-inset-top,0px));right:auto;bottom:auto;width:340px;max-width:calc(100vw - 32px);max-height:calc(100% - 84px);overflow:auto;margin:0;transform:translateX(calc(-100% - 40px));touch-action:auto}
  #kort .grep{display:none}
}
/* «Reduser bevegelse» gjelder ikke kortet: Vegars valg (CHANGELOG v27, se 15_bevegelse.js) */
#kort h2{margin:0 0 4px;font-size:18px;font-weight:600}
#kort p{margin:2px 0;font-size:13px;color:var(--muted)}
#kort .lukk{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
#kort .farge{display:flex;gap:6px;margin-top:10px;align-items:center;font-size:12px;color:var(--muted)}
#kort .her{list-style:none;margin:8px 0 0;padding:0;font-size:14px;line-height:1.45;color:var(--ink)}
#kort .ogsa-t{margin:12px 0 0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);opacity:.6}
#kort .ogsa{list-style:none;margin:4px 0 0;padding:0;font-size:14px;line-height:1.45;color:var(--ink)}
#kort .her:empty,#kort .ogsa:empty,#kort .ogsa-t:empty,#kort .id:empty,#kort .b:empty{display:none}
#kort .id{margin-top:8px;font-size:11px;letter-spacing:.02em;opacity:.8}
#kort .farge i{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
/* «Del» (02.11): kopierer lenka til utsikten og huset (15_lenke); haken er bekreftelsen */
#kort .del{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:0;border-radius:18px;padding:8px 13px;background:rgba(43,36,32,.07);color:var(--ink);font:500 13px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;cursor:pointer;transition:background var(--t-kort-ut,240ms) var(--k-flytt,ease)}
#kort .del:hover{background:rgba(43,36,32,.12)}
#kort .del:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#kort .del .ok{display:none}
#kort .del.delt .ok{display:block}
#kort .del.delt .ikon{display:none}

/* MapLibre-knappene i kartets papirtone */
.maplibregl-ctrl-bottom-right{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.maplibregl-ctrl-group{background:rgba(246,243,234,.92);border-radius:14px;box-shadow:0 4px 16px rgba(40,30,20,.14);overflow:hidden}
.maplibregl-ctrl-group button{width:38px;height:38px;border-color:rgba(43,36,32,.12)}
