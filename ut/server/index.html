<style>
:root{--bg:#e2e1d6;--ink:#2b2420;--paper:#f6f3ea;--muted:#7a7166}

canvas{display:block;touch-action:none;position:fixed;inset:0;opacity:0;transition:opacity .45s ease-out}

#hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;letter-spacing:.02em;color:var(--ink);background:rgba(246,243,234,.82);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:normal;max-width:min(88vw,560px);text-align:center;line-height:1.45}
#hjem{z-index:5;position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;border:0;border-radius:22px;padding:10px 14px;background:rgba(246,243,234,.92);color:var(--ink);font:500 13px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;box-shadow:0 4px 16px rgba(40,30,20,.14);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .4s,transform .4s}

#hjem:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#kort{z-index:5;position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:380px;margin:0 auto;background:var(--paper);border-radius:14px;padding:16px 18px;box-shadow:0 10px 30px rgba(40,30,20,.18);transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#kort.vis{transform:none}
#kort h2{margin:0 0 4px;font-size:18px;font-weight:600}
#kort p{margin:2px 0;font-size:13px;color:var(--muted)}
#kort .lukk{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
#kort .farge{display:flex;gap:6px;margin-top:10px;align-items:center;font-size:12px;color:var(--muted)}
#kort .farge i{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
</style>

<div id="kort"><button class="lukk" aria-label="Lukk">×</button><h2></h2><p class="a"></p><p class="b"></p><div class="farge"></div></div>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

const TEX_VANN='assets/vann.png';
const texLoader=new THREE.TextureLoader();
// Penselstrøk: bakt fra The Intergalactic Liquid & Irregular Brushes (Illustrator CC-installfil, tegnebrett 1–3, 23 strøk). Kilde: 05 Grafisk design/Illustrator Brushes.
const TEX_PENSEL='assets/pensel.png';
const penselTex=texLoader.load(TEX_PENSEL, t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.minFilter=THREE.LinearMipmapLinearFilter; t.magFilter=THREE.LinearFilter; t.needsUpdate=true; });
const DATA = await (await fetch('data/by.json')).json();
const INK = 0x3a2c26;
const renderer = new THREE.WebGLRenderer({antialias:true});
// pikselbudsjett: store skjermer (5K/4K) starter med færre piksler, så introen går jevnt; heves etter introen hvis maskinen har overskudd
// skjermen tegnes alltid skarpt (full pikseltetthet). Mens kartet beveger seg regnes 3D-bildet i lavere oppløsning,
// og når det står stille tegnes det på nytt i full kvalitet - slik kart-apper gjør det.
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const PIX_BEVEG=3.0e6, PIX_STILLE=11e6;
let skalaBeveg=1, skalaStille=1;
function beregnSkala(){ const n=renderer.domElement.width*renderer.domElement.height; skalaBeveg=THREE.MathUtils.clamp(Math.sqrt(PIX_BEVEG/n),0.4,1); skalaStille=1; /* stillbilde alltid i full oppløsning */ }
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // myk filtrering gjøres i skyggeMask()
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost',e=>{ e.preventDefault(); if(!sessionStorage.getItem('gl-tapt')){ sessionStorage.setItem('gl-tapt','1'); location.reload(); } });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe2e1d6);

// Ortografisk kamera = plakatens isometri
let VIEW = 300;
const cam = new THREE.OrthographicCamera(-1,1,1,-1,-4000,4000);
function fit(){
  const a = innerWidth/innerHeight;
  const v = a < 1 ? VIEW*1.15 : VIEW*0.62;
  cam.left=-v*a/1; cam.right=v*a/1; cam.top=v; cam.bottom=-v;
  if (a<1){ cam.left=-v*a; cam.right=v*a; }
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  post.size();
}
addEventListener('resize',fit);

// ---- etterbehandling: blekkstrek rundt alle former og skygge i hjørner, som i tegningen ----
const post=(()=>{
  let W=2, H=2, skala=1;
  const rt=new THREE.WebGLRenderTarget(2,2,{samples: devicePixelRatio>=1.5?2:4, type:THREE.HalfFloatType});
  rt.depthTexture=new THREE.DepthTexture(2,2); rt.depthTexture.type=THREE.UnsignedIntType;
  const m=new THREE.ShaderMaterial({
    uniforms:{tCol:{value:rt.texture}, tDep:{value:rt.depthTexture}, res:{value:new THREE.Vector2(2,2)}, mpp:{value:1}, span:{value:8000}, px:{value:1}, tilt:{value:0}, aoN:{value:14}, ssN:{value:1}, tid:{value:0}, sk:{value:1}, dpr:{value:1}, invPV:{value:new THREE.Matrix4()}, blekk:{value:new THREE.Color(0x24211f)}, tPensel:{value:penselTex}},
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:`uniform sampler2D tCol, tDep, tPensel; uniform vec2 res; uniform float mpp, span, px, tilt, aoN, tid, sk, dpr, ssN; uniform mat4 invPV; uniform vec3 blekk;
 varying vec2 vUv;
      float D(vec2 o){ return texture2D(tDep, vUv+o/res).x*span; }
      // dybde med lukking: hårfine sprekker mellom takflater (1 px) lukkes, så de ikke blir prikker i streken
      float Dm(vec2 o){ return min(D(o), min(D(o+vec2(1.,0.)), D(o+vec2(0.,1.)))); }
      // strekstyrke ved en forskyvning (piksler): knekker (inner) og dybdesprang (silhuett)
      float strekVed(vec2 o, float s1, float s2, float mpp){
        float ec=Dm(o);
        float a1=Dm(o+vec2(-s1,0.)), b1=Dm(o+vec2(s1,0.)), c1=Dm(o+vec2(0.,s1)), d1=Dm(o+vec2(0.,-s1));
        float a2=Dm(o+vec2(-s2,0.)), b2=Dm(o+vec2(s2,0.)), c2=Dm(o+vec2(0.,s2)), d2=Dm(o+vec2(0.,-s2));
        float L1=max(abs(a1+b1-2.*ec), abs(c1+d1-2.*ec))/(mpp*s1);
        float L2=max(abs(a2+b2-2.*ec), abs(c2+d2-2.*ec))/(mpp*s2);
        return max(smoothstep(0.34,0.85,L1)*0.78, smoothstep(3.5,7.0,L2));
      }
      float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      void main(){
        vec3 col=texture2D(tCol,vUv).rgb;
        // miniatyr-effekt: myk uskarphet øverst og nederst i bildet (sterkest i introen)
        float tb=tilt*smoothstep(0.16,0.5,abs(vUv.y-0.52));
        if(tb>0.01){ vec3 acc=col; float wsum=1.;
          for(int i=0;i<12;i++){ float a=float(i)*2.39996; float r=tb*7.*sqrt((float(i)+.5)/12.);
            acc+=texture2D(tCol, vUv+vec2(cos(a),sin(a))*r/res).rgb; wsum+=1.; }
          col=acc/wsum; }
        float zc=D(vec2(0.));
        if(zc>span*0.999){ gl_FragColor=vec4(col,1.);
          #include <colorspace_fragment>
          return; }
        // verdensposisjon for pikselen: støyen i streken forankres i byen, så den ikke kryper når kameraet beveger seg
        vec4 wp4=invPV*vec4(vUv*2.-1., texture2D(tDep,vUv).x*2.-1., 1.); vec2 wxz=wp4.xz/wp4.w;
        float zl=D(vec2(-px,0.)), zr=D(vec2(px,0.)), zu=D(vec2(0.,px)), zd=D(vec2(0.,-px));
        // ---- organisk blekkstrek ----
        // tykkelse etter zoom: tynn i oversikten, fyldigere tett på
        // strekbredden regnes i skjermpunkter (CSS-px), så den er lik på alle skjermer og i både rask og skarp tegning
        float mppC=mpp*sk/dpr;                              // meter per skjermpunkt
        float wi=clamp(0.22/mppC, 0.65, 1.5);               // tynn i oversikten, fyldigere tett på
        float s1=max(1.,floor(wi*dpr*sk*0.75+0.5)), s2=max(s1+1.,floor(wi*dpr*sk*1.2+0.5)); // hele piksler: ingen falske linjer på flat mark
        // lavfrekvent skjelving (bølgelengde ca. 40 px), som en tusj som ikke følger linjalen
        float fq=1./(40.*mpp);
        vec2 wob=vec2(vn(wxz*fq)-0.5, vn(wxz*fq+17.3)-0.5)*0.5*px; // liten, myk forskyvning: større gir sikksakk på lange linjer
        float ec=Dm(wob);
        float a1=Dm(wob+vec2(-s1,0.)), b1=Dm(wob+vec2(s1,0.)), c1=Dm(wob+vec2(0.,s1)), d1=Dm(wob+vec2(0.,-s1));
        float a2=Dm(wob+vec2(-s2,0.)), b2=Dm(wob+vec2(s2,0.)), c2=Dm(wob+vec2(0.,s2)), d2=Dm(wob+vec2(0.,-s2));
        // sprekkpiksel: dypere enn alle naboene -> vis naboenes farge i stedet for det som ligger bak
        if(zc>min(min(zl,zr),min(zu,zd))+0.4 && zc>max(max(zl,zr),max(zu,zd))-0.05){
          col=0.25*(texture2D(tCol,vUv+vec2(px,0.)/res).rgb+texture2D(tCol,vUv-vec2(px,0.)/res).rgb+texture2D(tCol,vUv+vec2(0.,px)/res).rgb+texture2D(tCol,vUv-vec2(0.,px)/res).rgb); }
        // kantutjevnet strek: snitt av fire forskjøvne prøver (roterte rutenett), så skrå linjer blir glatte og ikke trappete
        float ink;
        if(ssN>1.5){ ink=0.25*(strekVed(wob+vec2(0.375,-0.125)*2.,s1,s2,mpp)+strekVed(wob+vec2(-0.125,-0.375)*2.,s1,s2,mpp)
                              +strekVed(wob+vec2(-0.375,0.125)*2.,s1,s2,mpp)+strekVed(wob+vec2(0.125,0.375)*2.,s1,s2,mpp)); ink=smoothstep(0.,0.85,ink); }
        else ink=strekVed(wob,s1,s2,mpp);
        // trykkvariasjon og små brudd langs streken
        // trykk og brudd fra penselpakken: teksturen leses i byens koordinater, så strøket står stille når kameraet går
        float pen=texture2D(tPensel, wxz*fq*0.55).r;
        float pen2=texture2D(tPensel, wxz*fq*1.7+vec2(0.37,0.61)).r;
        ink*=0.62+0.38*pen2;
        float brudd=smoothstep(0.36,0.52, pen);
        ink*=mix(0.10,1.,brudd);
        // terrenget (alfa 0) får ikke strek i egne knekker, men kanten mot hus, trær og vann får strek
        float aC=texture2D(tCol,vUv).a;
        float aN=max(max(texture2D(tCol,vUv+(wob+vec2(s2,0.))/res).a,texture2D(tCol,vUv+(wob-vec2(s2,0.))/res).a),max(texture2D(tCol,vUv+(wob+vec2(0.,s2))/res).a,texture2D(tCol,vUv+(wob-vec2(0.,s2))/res).a));
        ink*=max(aC,aN);
        // strekfargen er en mørk versjon av flaten som ligger foran (som i tegningen), ikke ren svart
        vec3 cn=texture2D(tCol,vUv+wob/res).rgb; float zn=ec;
        if(a2<zn){ zn=a2; cn=texture2D(tCol,vUv+(wob+vec2(-s2,0.))/res).rgb; }
        if(b2<zn){ zn=b2; cn=texture2D(tCol,vUv+(wob+vec2(s2,0.))/res).rgb; }
        if(c2<zn){ zn=c2; cn=texture2D(tCol,vUv+(wob+vec2(0.,s2))/res).rgb; }
        if(d2<zn){ zn=d2; cn=texture2D(tCol,vUv+(wob+vec2(0.,-s2))/res).rgb; }
        vec3 blekkF=mix(blekk, cn*0.38, 0.65); // strekfarge nær flatens egen mørke tone: ingen svart halo
        // skygge i hjørner og der hus møter bakken (planbevisst, så flat bakke ikke mørkner)
        float gX=abs(zr-zc)<abs(zc-zl)? zr-zc : zc-zl; float gY=abs(zu-zc)<abs(zc-zd)? zu-zc : zc-zd;
        float R=clamp(2.4/mpp, 4., 48.); float ao=0.; float j=h(gl_FragCoord.xy)*6.2831;
        for(int i=0;i<14;i++){
          if(float(i)>=aoN) break;
          float a=float(i)*2.39996+j; float r=R*sqrt((float(i)+.5)/aoN);
          vec2 o=vec2(cos(a),sin(a))*r;
          float zs=D(o); float zp=zc+(gX*o.x+gY*o.y)/px;
          float dz=zp-zs;
          ao+=smoothstep(0.12,0.7,dz)*(1.-smoothstep(3.5,7.,dz));
        }
        ao/=max(aoN,1.);
        col*=mix(vec3(1.),vec3(0.60,0.645,0.76),ao*aC); // hjørneskygge i himmeltone, ikke grå
        // skyskygger som driver sakte over byen
        vec2 cp=wxz*0.0035+vec2(tid*0.006,tid*0.0025);
        float sky=vn(cp)*0.6+vn(cp*2.3+3.1)*0.3+vn(cp*5.1-1.7)*0.1;
        col*=1.-0.09*smoothstep(0.52,0.78,sky);
        col=mix(col, blekkF, ink*0.9*(1.-tb*0.8));
        // kartet toner ut i papiret rundt Gamlebyen, så kantene av kartdataene aldri synes
        float rr=length((wxz-vec2(10.,0.))*vec2(0.85,1.0));
        col=mix(col, vec3(0.925,0.915,0.885), smoothstep(380.,600.,rr));
        // svak vignett, som papir under lampe
        vec2 vv=vUv-0.5; col*=1.-0.10*pow(clamp(length(vv)*1.35,0.,1.),2.2);
        // papirkorn
        col*=0.985+0.03*h(floor(gl_FragCoord.xy*0.5));
        gl_FragColor=vec4(col,1.);
        #include <colorspace_fragment>
      }`
  });
  const q=new THREE.Mesh(new THREE.PlaneGeometry(2,2),m); q.frustumCulled=false;
  // kantutjevning til slutt (FXAA): blekkstreken regnes fra dybden og får ellers trappetrinn
  const rtF=new THREE.WebGLRenderTarget(2,2); rtF.texture.colorSpace=THREE.SRGBColorSpace;
  const fx=new THREE.ShaderMaterial({ uniforms:{ tDiffuse:{value:rtF.texture}, resolution:{value:new THREE.Vector2(0.5,0.5)} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
    fragmentShader:FXAAShader.fragmentShader.replace(/\}\s*$/, '  #include <colorspace_fragment>\n}') });
  const fq=new THREE.Mesh(new THREE.PlaneGeometry(2,2),fx); fq.frustumCulled=false; const fs=new THREE.Scene(); fs.add(fq);
  const ps=new THREE.Scene(); ps.add(q); const pc=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  return {
    setAO(n){ m.uniforms.aoN.value=n; },
    setSS(n){ m.uniforms.ssN.value=n; },
    size(){ const w=renderer.domElement.width, h=renderer.domElement.height; W=w; H=h; beregnSkala(); this.settSkala(skala,true); rtF.setSize(w,h); fx.uniforms.resolution.value.set(1/w,1/h); },
    settSkala(s,tving){ if(!tving && Math.abs(s-skala)<0.02) return; skala=s; const w=Math.max(2,Math.round(W*s)), h=Math.max(2,Math.round(H*s)); rt.setSize(w,h); m.uniforms.res.value.set(w,h); try{ waterMat.uniforms.res.value.set(w,h); }catch(_){} }, // vannet slår opp speilet i samme pikselrom som bildet det tegnes i
    skala(){ return skala; },
    render(){ const u=m.uniforms; u.mpp.value=(cam.right-cam.left)/cam.zoom/u.res.value.x; u.span.value=cam.far-cam.near; u.px.value=Math.max(1.,renderer.getPixelRatio()*skala*0.9); u.sk.value=skala; u.dpr.value=renderer.getPixelRatio(); u.tid.value=performance.now()/1000; u.invPV.value.multiplyMatrices(cam.projectionMatrix,cam.matrixWorldInverse).invert(); u.tilt.value=introDone? 0.0 : 1.0; // miniatyr-uskarphet bare i introen
      const _t0=performance.now(); renderer.setRenderTarget(rt); renderer.render(scene,cam); const _t1=performance.now(); renderer.setRenderTarget(rtF); renderer.render(ps,pc); renderer.setRenderTarget(null); renderer.render(fs,pc); window.__pt={scene:_t1-_t0, blekk:performance.now()-_t1, kall:renderer.info.render.calls, tri:renderer.info.render.triangles}; }
  };
})();

// koordinater: x = øst, z = -nord
const V = (p)=> new THREE.Vector2(p[0], p[1]);

// ---- lys: sola ----
// Plakatsolen (standard): sola står øverst til venstre i bildet uansett hvordan byen snus, som i trykkfila.
// Ekte sol: setSol(asimut, høyde) i radianer, asimut fra nord med klokka. Skyggene følger sola i begge moduser.
const hemi = new THREE.HemisphereLight(0xffffff, 0xe6e2d6, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera; sc.left=-520; sc.right=520; sc.top=520; sc.bottom=-520; sc.near=1; sc.far=4000;
sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.25; sun.shadow.radius=4; sun.shadow.blurSamples=12;
const LYS = new THREE.Vector3(-0.66, 0.52, 0.54).normalize(); // lyset penselmatcapen til trærne er tegnet med (kamerarommet)
// plakatsolen i kamerarommet: fra venstre og litt over, så venstre fasader og tak er lyse, høyre fasader i skygge (som trykket),
// og kastskyggene faller mot høyre i bildet der de synes, ikke bak husene
const PLAKAT = new THREE.Vector3(-0.75, 0.65, 0.10).normalize();
const GRAD=Math.PI/180;
// solposisjon (samme formler som SunCalc): asimut fra nord med klokka og høyde over horisonten, i radianer
function solposisjon(dato, lat=59.2075, lon=10.9545){
  const dager=dato.valueOf()/864e5-0.5+2440588-2451545;
  const M=GRAD*(357.5291+0.98560028*dager);
  const C=GRAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const L=M+C+GRAD*102.9372+Math.PI, e=GRAD*23.4397;
  const dek=Math.asin(Math.sin(e)*Math.sin(L)), ra=Math.atan2(Math.sin(L)*Math.cos(e),Math.cos(L));
  const phi=GRAD*lat, H=GRAD*(280.16+360.9856235*dager)+GRAD*lon-ra;
  const hoyde=Math.asin(Math.sin(phi)*Math.sin(dek)+Math.cos(phi)*Math.cos(dek)*Math.cos(H));
  const azSor=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dek)*Math.cos(phi));
  return {asimut:azSor+Math.PI, hoyde};
}
const SOL={modus:'plakat', asimut:0, hoyde:35*GRAD};
// sollyset blir varmere jo lavere sola står
function solFargeFor(hoyde){ const k=THREE.MathUtils.smoothstep(hoyde,4*GRAD,34*GRAD);

#endif
// myk kastskygge: 16 prøver i en roterende spiral, halvskyggen er ca. én meter bred uansett zoom
float skyggeMask(){ float s=1.;
#if defined(USE_SHADOWMAP) && NUM_DIR_LIGHT_SHADOWS>0
  DirectionalLightShadow dl=directionalLightShadows[0];
  vec4 sc=vDirectionalShadowCoord[0]; vec3 p=sc.xyz/sc.w; p.z+=dl.shadowBias;
  if(p.x>=0.&&p.x<=1.&&p.y>=0.&&p.y<=1.&&p.z<=1.){

    float ang=fract(52.9829189*fract(dot(gl_FragCoord.xy,vec2(0.06711056,0.00583715))))*6.2831853;
    for(int i=0;i<16;i++){ float r=sqrt((float(i)+0.5)/16.); float a=float(i)*2.3999632+ang;

vec3 solRetning(){
#if NUM_DIR_LIGHTS>0
  return directionalLights[0].direction;
#else
  return normalize(vec3(-0.66,0.52,0.54));
#endif
}
vec3 solFarge(){

    vertexShader:`#include <common>
      #include <shadowmap_pars_vertex>

      varying vec2 vUv; varying vec3 vCol; varying float vSeed; varying float vRad;
      void main(){
        vec3 c=(modelMatrix*instanceMatrix*vec4(0.,0.,0.,1.)).xyz;

        vec3 up=vec3(viewMatrix[0][1],viewMatrix[1][1],viewMatrix[2][1]);
        vec3 wp=c+right*position.x*sx+up*position.y*sy;
        vUv=position.xy; vRad=sx;
        vSeed=fract(sin(dot(c.xz,vec2(12.9898,78.233)))*43758.5453);
        vCol=vec3(1.);
        #ifdef USE_INSTANCING_COLOR
        vCol=instanceColor;
        #endif

    fragmentShader:`#include <common>

      uniform vec3 sunDir; uniform float invSpan;

      void main(){
        float r=length(vUv), th=atan(vUv.y,vUv.x);

        float k=8.+floor(vSeed*5.);

// byen tegner seg opp: høyden vokser kvartal for kvartal (sortert sørvest -> nordøst)
const order = buildings.map(g=>{const c=g.userData.b.r; return [g, c[0]+c[1]];}).sort((a,b)=>a[1]-b[1]);
order.forEach(([g],k)=>{ g.userData.delay = 1.1*k/order.length; g.scale.y=0.001; });
let vokst=false;   // husene og trærne har vokst ferdig
function vokse(t){
  let ferdig=true;
  buildings.forEach(g=>{ const k=THREE.MathUtils.clamp((t-g.userData.delay)/0.5,0,1); g.scale.y=Math.max(0.001, 1-Math.pow(1-k,3)); if(k<1) ferdig=false; });

  if(ferdig) vokst=true;

// ---- speilinger i vannet: hus, trær og terreng tegnes speilvendt om vannflaten i et eget, halvt så stort lag ----
const speil=(()=>{
  const Y=0.15, LAG=1;
  const rt=new THREE.WebGLRenderTarget(2,2,{type:THREE.HalfFloatType});
  const deler=[city, ...[].concat(crowns)];
  scene.traverse(o=>{ if(o.isMesh && o.material && o.material.uniforms && o.material.uniforms.skyggeF) deler.push(o); });  // festningsterrenget skjuler det som står bak vollene
  deler.forEach(o=>o.traverse(c=>c.layers.enable(LAG)));
  let paa=!Q0.get('nospeil');
  const cc=new THREE.Color();
  return {
    size(){ const w=renderer.domElement.width, h=renderer.domElement.height; rt.setSize(Math.max(2,w>>1), Math.max(2,h>>1)); },
    av(){ paa=false; waterMat.uniforms.reflStyrke.value=0; },
    render(endret){
      if(!paa){ waterMat.uniforms.reflStyrke.value=0; return; }
      // tegnes bare på nytt når kameraet eller husene har flyttet seg (stillestående bilde koster ingenting ekstra)
      const e=cam.matrixWorld.elements, nok=e.join(',')+cam.zoom+(endret?Math.random():'');
      if(nok===this._sist) return; this._sist=nok;
      const lagre=deler.map(o=>[o.position.y,o.scale.y]);
      deler.forEach(o=>{ o.position.y=2*Y-o.position.y; o.scale.y=-o.scale.y; });
      const bg=scene.background; scene.background=null; renderer.getClearColor(cc); const ca=renderer.getClearAlpha();
      const au=renderer.shadowMap.autoUpdate; renderer.shadowMap.autoUpdate=false;
      cam.layers.set(LAG); renderer.setRenderTarget(rt); renderer.setClearColor(0x000000,0); renderer.clear(); renderer.render(scene,cam);
      cam.layers.set(0); renderer.setRenderTarget(null); renderer.setClearColor(cc,ca); renderer.shadowMap.autoUpdate=au; scene.background=bg;
      deler.forEach((o,i)=>{ o.position.y=lagre[i][0]; o.scale.y=lagre[i][1]; });
      waterMat.uniforms.tRefl.value=rt.texture;
      // speilingen tones ned i oversikten og kommer fram når man går nærmere, så den aldri popper
      waterMat.uniforms.reflStyrke.value=THREE.MathUtils.clamp(0.16+0.10*Math.log2(Math.max(cam.zoom,0.5)),0.1,0.36);
    }
  };
})();

  const p=solposisjon(new Date(dato+'T'+Q.get('sol')+':00'+off)); setSol(p.asimut,p.hoyde); }

// testkrok for kvalitetssjekk (skjermbilder uten ny sidelasting)
window.__skjerm=(x,z)=>{ const v=new THREE.Vector3(x,0,z).project(cam); return [(v.x+1)/2*innerWidth, (1-v.y)/2*innerHeight]; };
window.__kam=()=>{ const v=vinkler(cam.position.clone().sub(controls.target)); let vs=null; if(valgt){ const bb=new THREE.Box3().setFromObject(valgt); const c=bb.getCenter(new THREE.Vector3()); vs=window.__skjerm(c.x,c.z); } return {x:controls.target.x,z:controls.target.z,zoom:cam.zoom,az:v.az,pol:v.pol,anim:!!anim,valgt:vs,intro:!introDone,t:clock.getElapsedTime()}; };
window.__vis=(az,zoom,tx,ty)=>{ introDone=true; vokst=true; anim=null; buildings.forEach(g=>g.scale.y=1); setCrowns(null); target.set(tx,0,-ty); controls.target.copy(target); place(THREE.MathUtils.degToRad(az)); cam.zoom=zoom; zoomMaal=zoom; cam.updateProjectionMatrix(); controls.enabled=true; controls.update(); };
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeUt=t=>1-Math.pow(1-t,4);
// ytelse: måler bildefrekvensen og senker oppløsning/AO på svake maskiner (mobil), så spinnet holder seg mykt
let perfN=0, perfSum=0, perfLast=performance.now(), perfNivaa=Q.get('noadapt')?9:0;
function speilStyrke(){ return THREE.MathUtils.clamp(0.16+0.10*Math.log2(Math.max(cam.zoom,0.5)),0.1,0.36); }
let ssStille=4;
let speilInn=0, speilFrisk=false, sistBeveg=0, sistTegnet=0, fullTegnet=false, aoStille=14, aoBeveg=6; const _sisteKam=new THREE.Matrix4(); let _sisteZ=0;
function maalYtelse(){ const n=performance.now(), dt=n-perfLast; perfLast=n; if(perfNivaa>=2 || document.hidden || (n-sistBeveg>300 && n-sistTegnet>40)) return;
  perfN++; if(perfN>15){ perfSum+=dt; if(perfN>=75){ const avg=perfSum/60; perfN=0; perfSum=0;
    if(avg>30){ perfNivaa++; if(perfNivaa===1){ skalaBeveg=Math.max(0.35,skalaBeveg*0.75); aoBeveg=0; } else { skalaBeveg=Math.max(0.3,skalaBeveg*0.8); aoStille=7; sun.shadow.mapSize.set(1024,1024); if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } skyggeSkitten=true; } } } } }

// ---- kamera: alle bevegelser er myke (fjær/easing), zoom holder punktet under pekeren fast ----
const HOME={zoom:1, target:target.clone(), az:AZ0};
let anim=null, zoomMaal=cam.zoom, zoomAnker=null, sisteTid=performance.now();
const GRENSE=560;                                         // hvor langt fra byen man kan flytte seg (meter)
const _pl=new THREE.Plane(new THREE.Vector3(0,1,0),0), _rc=new THREE.Raycaster(), _v2=new THREE.Vector2();
function bakkeVed(x,y){ _v2.set(x/innerWidth*2-1, -(y/innerHeight)*2+1); _rc.setFromCamera(_v2,cam); const v=new THREE.Vector3(); return _rc.ray.intersectPlane(_pl,v)?v:null; }
function flytt(dx,dz){ controls.target.x+=dx; controls.target.z+=dz; cam.position.x+=dx; cam.position.z+=dz; }
function settZoom(z, anker){ // ortografisk: å skalere avstanden til ankeret med z/z' holder ankeret fast på skjermen
  z=THREE.MathUtils.clamp(z, controls.minZoom, controls.maxZoom);
  if(anker){ const f=cam.zoom/z; const tx=anker.x+(controls.target.x-anker.x)*f, tz=anker.z+(controls.target.z-anker.z)*f; flytt(tx-controls.target.x, tz-controls.target.z); }
  cam.zoom=z; cam.updateProjectionMatrix();
}
function innenforGrense(dt){ // myk fjær tilbake hvis man har dratt byen ut av syne
  const dx=controls.target.x-HOME.target.x, dz=controls.target.z-HOME.target.z, d=Math.hypot(dx,dz);
  if(d>GRENSE){ const k=1-Math.exp(-dt*6); const ny=(d-GRENSE)*k/d; flytt(-dx*ny,-dz*ny); }
}
function vinkler(off){ const r=off.length(); return {az:Math.atan2(off.x,off.z), pol:Math.acos(THREE.MathUtils.clamp(off.y/r,-1,1))}; }
function kortVei(a,b){ let d=b-a; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return a+d; }
// flyTo: myk bane for mål, zoom (logaritmisk), asimut (korteste vei) og helning. Med anker: punktet står stille under pekeren.
function flyTo(nyTarget, nyZoom, az, opt={}){
  const off=cam.position.clone().sub(controls.target); const v=vinkler(off);
  const tilAz = az===undefined ? v.az : kortVei(v.az, az);
  const tilPol = opt.pol!==undefined ? opt.pol : (az===undefined ? v.pol : Math.PI/2-ELEV);
  const z0=cam.zoom, z1=THREE.MathUtils.clamp(nyZoom, controls.minZoom, controls.maxZoom);
  const spenn=(cam.right-cam.left)/z0;
  const avst=nyTarget? Math.hypot(nyTarget.x-controls.target.x, nyTarget.z-controls.target.z) : 0;
  const dur = opt.dur || THREE.MathUtils.clamp(420 + 330*Math.abs(Math.log(z1/z0)) + 380*Math.abs(tilAz-v.az) + 260*Math.abs(tilPol-v.pol) + 520*Math.min(1, avst/spenn), 450, 1500);
  anim={t0:performance.now(), dur, e: opt.e || ease, fra:{t:controls.target.clone(), z:z0, az:v.az, pol:v.pol, r:off.length()}, til:{t:nyTarget?nyTarget.clone():controls.target.clone(), z:z1, az:tilAz, pol:tilPol}, anker:opt.anker||null};
  zoomAnker=null;
}
function stepAnim(){
  if(!anim) return; const k=Math.min(1,(performance.now()-anim.t0)/anim.dur); const e=anim.e(k);
  const z=Math.exp(THREE.MathUtils.lerp(Math.log(anim.fra.z), Math.log(anim.til.z), e));
  if(anim.anker){ const A=anim.anker, f=anim.fra.z/z; controls.target.set(A.x+(anim.fra.t.x-A.x)*f, 0, A.z+(anim.fra.t.z-A.z)*f); }
  else controls.target.lerpVectors(anim.fra.t, anim.til.t, e);
  const az=THREE.MathUtils.lerp(anim.fra.az, anim.til.az, e), pol=THREE.MathUtils.lerp(anim.fra.pol, anim.til.pol, e), r=anim.fra.r;
  cam.position.set(controls.target.x+r*Math.sin(pol)*Math.sin(az), controls.target.y+r*Math.cos(pol), controls.target.z+r*Math.sin(pol)*Math.cos(az));
  cam.zoom=z; cam.updateProjectionMatrix(); cam.lookAt(controls.target);
  if(k>=1){ anim=null; zoomMaal=cam.zoom; controls.update(); }
}
function stoppAnim(){ if(anim){ anim=null; zoomMaal=cam.zoom; } }

// avbryt introen når brukeren tar tak: kameraet blir stående der det er, byen vokser ferdig av seg selv
function overta(){ if(introDone) return; introDone=true; zoomMaal=cam.zoom; controls.enabled=true; controls.update(); }

function tick(){
  maalYtelse();
  const naa=performance.now(), dt=Math.min(0.1,(naa-sisteTid)/1000); sisteTid=naa;
  const t=Q.get('t')?+Q.get('t'):clock.getElapsedTime();
  waterMat.uniforms.t.value=t;
  if(!vokst) vokse(t*VEKST_FART+0.45);
  if(!introDone){
    const k=THREE.MathUtils.clamp((t-SPIN_START)/SPIN,0,1); const e=1-Math.pow(1-k,4); // rask start, myk landing
    cam.zoom=THREE.MathUtils.lerp(Z0,1,e); cam.updateProjectionMatrix();
    place(AZ0 + SVEIP*(1-e), THREE.MathUtils.lerp(EL0,ELEV,e));
    if(t>SPIN_START){ if(k>=1){ introDone=true; zoomMaal=cam.zoom; controls.enabled=true; controls.update(); setTimeout(()=>document.getElementById('hint').style.opacity=1,300); setTimeout(()=>document.getElementById('hint').style.opacity=0,6000);} }
  } else {
    if(anim) stepAnim();
    else {
      // myk zoom mot målet (hjul/styreflate), ankeret står stille under pekeren
      if(Math.abs(Math.log(zoomMaal/cam.zoom))>1e-4){ const k=1-Math.exp(-dt*13); settZoom(Math.exp(Math.log(cam.zoom)+(Math.log(zoomMaal)-Math.log(cam.zoom))*k), zoomAnker); }
      innenforGrense(dt);
      controls.update();
    }
    visHjem();
  }
  // løftet hus (valgt) og svakt løftet hus (pekeren over), uavhengig av bildefrekvens
  const kl=1-Math.exp(-dt*11);
  let husBeveger=!vokst;
  buildings.forEach(g=>{ const ty=g.userData.lift?3:(g===hover?0.9:0); const dy=(ty-g.position.y)*kl; if(Math.abs(dy)>1e-4){ g.position.y+=dy; husBeveger=true; } });
  if(husBeveger) skyggeSkitten=true;
  if(!introDone) skyggeSkitten=true;
  oppdaterSol();
  // beveger kartet seg? da tegnes det raskt; står det stille, tegnes det skarpt én gang og deretter rolig (vannet lever)
  const kamFlytt = !_sisteKam.equals(cam.matrixWorld) || _sisteZ!==cam.zoom; _sisteKam.copy(cam.matrixWorld); _sisteZ=cam.zoom;
  // kvaliteten følger bare kameraet: hus som løfter seg tegnes i full kvalitet hvert bilde, så et klikk ikke bytter tilstand
  if(kamFlytt || anim || !introDone) sistBeveg=naa;
  const stille = naa-sistBeveg>300;
  post.settSkala(stille? skalaStille : skalaBeveg); post.setAO(stille? aoStille : aoBeveg); post.setSS(stille && perfNivaa<2 ? ssStille : 1);
  if(introDone && stille){ speilInn=Math.min(1,speilInn+dt*2.8); speil.render(husBeveger || speilInn<1 || !speilFrisk); speilFrisk=true; }
  else if(!stille){ speilFrisk=false; speilInn=Math.max(0,speilInn-dt*8); } // gammelt speil vises aldri mens kartet beveger seg
  waterMat.uniforms.reflStyrke.value=speilStyrke()*speilInn;
  if(!stille || husBeveger || !fullTegnet || naa-sistTegnet>100){ post.render(); sistTegnet=naa; fullTegnet=stille && !husBeveger; if(!_synlig){ _synlig=true; requestAnimationFrame(()=>renderer.domElement.style.opacity=1); } }
  dbgTegn(naa);
  requestAnimationFrame(tick);
}

// ---- klikk, dobbeltklikk, hjul, klyp og tilbake til hele byen ----
const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2(); let down=null, valgt=null, klikkTimer=null, sisteTrykk=0, hover=null;
const kort=document.getElementById('kort'); const hjem=document.getElementById('hjem');
function treffHus(x,y){ ptr.set(x/innerWidth*2-1, -(y/innerHeight)*2+1); ray.setFromCamera(ptr,cam);
  const hit=ray.intersectObjects(city.children,true).find(h=>h.object.isMesh); if(!hit) return null;
  let g=hit.object; while(g.parent!==city) g=g.parent; return {g, p:hit.point}; }
function bakkepunkt(e){ const h=treffHus(e.clientX,e.clientY); if(h) return new THREE.Vector3(h.p.x,0,h.p.z); return bakkeVed(e.clientX,e.clientY); }
function velg(e){
  const h=treffHus(e.clientX,e.clientY);
  if(valgt){valgt.userData.lift=false; valgt=null;}
  if(!h){kort.classList.remove('vis'); return;}
  const g=h.g; valgt=g; g.userData.lift=true;
  const b=g.userData.b;
  kort.querySelector('h2').textContent = b.navn || b.adr || 'Bygg i Gamlebyen';
  kort.querySelector('.a').textContent = b.adr || (b.tekst ? 'Fra kartbrosjyren til Visit Fredrikstad (2015)' : ''); // OSM-typen (engelsk, f.eks. «office») vises ikke
  kort.querySelector('.b').textContent = b.tekst || 'Historie, bilder og bruk kommer her.';
  const f=kort.querySelector('.farge'); f.innerHTML='';
  if(b.vegg){ f.innerHTML += `<i style="background:rgb(${b.vegg})"></i>Godkjent fasadefarge`; }
  kort.classList.add('vis');
  // står huset under kortet eller utenfor bildet, glir kartet rolig så huset blir synlig over kortet
  const B=new THREE.Vector3(h.p.x,0,h.p.z); const s=B.clone().project(cam);
  const kortTopp = 1-2*Math.max(0.2, (kort.offsetTop||innerHeight*0.72)/innerHeight);   // kortets plass uten innglidningen
  if(s.y < kortTopp+0.12 || Math.abs(s.x)>0.85 || s.y>0.88){
    const G=bakkeVed(innerWidth/2, innerHeight*0.4); if(G) flyTo(new THREE.Vector3(controls.target.x+B.x-G.x,0,controls.target.z+B.z-G.z), cam.zoom, undefined, {dur:700});
  }
}
function zoomInn(e, ut){
  const p=bakkepunkt(e); if(!p) return;
  const z = ut ? Math.max(1, cam.zoom/2.2) : Math.min(controls.maxZoom, cam.zoom*2.2);
  if(ut && z<=1.01) flyTo(HOME.target, 1, undefined, {e:ease});
  else flyTo(null, z, undefined, {anker:p, e:easeUt, dur:560});   // punktet man dobbeltklikket står stille mens kartet zoomer
}
function hjemNaa(){ flyTo(HOME.target, HOME.zoom, HOME.az); if(valgt){valgt.userData.lift=false; valgt=null;} kort.classList.remove('vis'); }
hjem.onclick=()=>{ overta(); hjemNaa(); };
addEventListener('keydown',e=>{ if(e.key==='Escape'){ overta(); hjemNaa(); } });
const el=renderer.domElement;
// hjul og styreflate: myk zoom mot pekeren
const gest={t:0,hjul:false};
const dbg={paa:false, rader:[], el:null, fps:[]};
function dbgLogg(e,hjul){ if(!dbg.paa) return; dbg.rader.push(`${(performance.now()%100000|0)} dx${e.deltaX.toFixed(1)} dy${e.deltaY.toFixed(1)} w${e.wheelDeltaY} m${e.deltaMode} ${e.ctrlKey?'ctrl ':''}${hjul?'ZOOM':'flytt'}`); if(dbg.rader.length>40) dbg.rader.shift(); }
function dbgTegn(naa){ if(!dbg.paa) return; dbg.fps.push(naa); while(dbg.fps.length&&naa-dbg.fps[0]>1000) dbg.fps.shift();
  dbg.el.textContent=`fps ${dbg.fps.length}  zoom ${cam.zoom.toFixed(2)}  perfNivaa ${perfNivaa}  skalaBeveg ${skalaBeveg.toFixed(2)}  stille ${naa-sistBeveg>300?1:0}  anim ${anim?1:0}  ss ${ssStille} ao ${aoStille} skalaS ${skalaStille}  skygge ${sun.shadow.needsUpdate?1:0}\n3D ${(window.__pt||{}).scene|0} ms  blekk ${(window.__pt||{}).blekk|0} ms  kall ${(window.__pt||{}).kall}  tri ${(window.__pt||{}).tri}  tegnet ${naa-sistTegnet<20?1:0}`+String.fromCharCode(10)+dbg.rader.join(String.fromCharCode(10)); }
addEventListener('keydown',e=>{ if(!dbg.paa) return; if(e.key==='s'){ ssStille=ssStille===4?2:ssStille===2?1:4; } if(e.key==='a'){ aoStille=aoStille===14?7:aoStille===7?0:14; } if(e.key==='x'){ skalaStille=skalaStille===1?0.75:1; } if(e.key==='p'){ speil.av(); } });
addEventListener('keydown',e=>{ if(e.key==='d'&&!e.metaKey&&!e.ctrlKey){ dbg.paa=!dbg.paa; if(!dbg.el){ dbg.el=document.createElement('pre'); dbg.el.style.cssText='position:fixed;left:8px;top:8px;z-index:9;margin:0;padding:8px;font:11px/1.25 ui-monospace,monospace;background:rgba(255,255,255,.92);color:#222;max-height:92vh;overflow:hidden;pointer-events:none;border-radius:6px'; document.body.appendChild(dbg.el); } dbg.el.style.display=dbg.paa?'block':'none'; } });
el.addEventListener('wheel',e=>{ e.preventDefault(); overta(); stoppAnim();
  // vanlig kartpraksis på Mac: sveip med to fingre (styreflate/Magic Mouse) flytter kartet, klyp zoomer,
  // et vanlig musehjul (hakk) zoomer. Hjulhakk kjennes på wheelDeltaY i hele 120-steg uten sidelengs bevegelse.
  // én gest er én ting: første hendelse avgjør om det er flytting (to fingre) eller zoom (hjul/klyp); hendelser innen 120 ms arver valget
  const naa=performance.now();
  let hjul = !e.ctrlKey && (e.deltaMode!==0 || (e.deltaX===0 && e.wheelDeltaY && e.wheelDeltaY%120===0 && e.wheelDeltaY!==-3*e.deltaY));
  if(!e.ctrlKey && gest.t && naa-gest.t<120) hjul=gest.hjul;
  gest.t=naa; gest.hjul=hjul; dbgLogg(e,hjul);
  if(!e.ctrlKey && !hjul){
    const P0=bakkeVed(e.clientX,e.clientY), P1=bakkeVed(e.clientX-e.deltaX, e.clientY-e.deltaY);   // innholdet følger fingrene
    if(P0&&P1) flytt(P0.x-P1.x, P0.z-P1.z); zoomMaal=cam.zoom; return;
  }

  zoomMaal=THREE.MathUtils.clamp(zoomMaal*f, controls.minZoom, controls.maxZoom);
  zoomAnker=bakkeVed(e.clientX,e.clientY);
},{passive:false});
el.addEventListener('pointerdown',e=>{ const varIntro=!introDone; overta(); down=varIntro?null:[e.clientX,e.clientY]; stoppAnim(); zoomMaal=cam.zoom; });   // klikket som stopper introen velger ikke et hus
el.addEventListener('pointerup',e=>{
  if(!introDone||!down) return; if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>(e.pointerType==='touch'?12:6)) return;
  if(fingre.size>1 || toFinger) return;   // ett fingertrykk er et klikk (fingeren slippes først i slipp())
  const naa=performance.now();
  if(naa-sisteTrykk<300){ clearTimeout(klikkTimer); sisteTrykk=0; zoomInn(e, e.shiftKey||e.altKey); return; }
  sisteTrykk=naa; const ev={clientX:e.clientX, clientY:e.clientY};
  klikkTimer=setTimeout(()=>velg(ev),300);
});
// peker over et hus (bare mus): huset løfter seg litt
let sisteHover=0;
el.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse' || e.buttons || anim || !introDone) { if(e.buttons && hover){ hover=null; el.style.cursor=''; } return; }
  const n=performance.now(); if(n-sisteHover<45) return; sisteHover=n;
  const h=treffHus(e.clientX,e.clientY); hover=h?h.g:null; el.style.cursor=hover?'pointer':''; });
el.addEventListener('pointerleave',()=>{ hover=null; el.style.cursor=''; });
// to fingre: klyp = zoom rundt midtpunktet, vri = snu byen, flytt = flytte kartet, parallelt opp/ned = vippe. Kort trykk med to fingre = zoom ut.
let fingre=new Map(), toFinger=null;
el.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; fingre.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(fingre.size===2){ const [a,b]=[...fingre.values()]; toFinger={t0:performance.now(), d:Math.hypot(b.x-a.x,b.y-a.y), v:Math.atan2(b.y-a.y,b.x-a.x), m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}, flyttet:0}; clearTimeout(klikkTimer); } });
el.addEventListener('pointermove',e=>{ if(!fingre.has(e.pointerId)) return; fingre.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(fingre.size!==2 || !toFinger) return;
  const [a,b]=[...fingre.values()]; const d=Math.hypot(b.x-a.x,b.y-a.y), v=Math.atan2(b.y-a.y,b.x-a.x), m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  // to fingre som glir parallelt opp/ned = vippe kartet (som Google og Apple Maps); ellers følger kartet fingrene
  const mdx=m.x-toFinger.m.x, mdy=m.y-toFinger.m.y, a0=[...fingre.values()];
  const parallellVipp = Math.abs(mdy)>2*Math.abs(mdx) && Math.abs(Math.log(d/toFinger.d))<0.01 && Math.abs(a.y-b.y)<0.35*Math.abs(a.x-b.x)+60;
  if(parallellVipp){ const off=cam.position.clone().sub(controls.target); const sp=new THREE.Spherical().setFromVector3(off);
    sp.phi=THREE.MathUtils.clamp(sp.phi-mdy*0.006, controls.minPolarAngle, controls.maxPolarAngle); off.setFromSpherical(sp); cam.position.copy(controls.target).add(off); cam.lookAt(controls.target); }
  else { const P0=bakkeVed(toFinger.m.x,toFinger.m.y), P1=bakkeVed(m.x,m.y); if(P0&&P1) flytt(P0.x-P1.x, P0.z-P1.z); }
  // klyp
  const A=bakkeVed(m.x,m.y); if(toFinger.d>0) settZoom(cam.zoom*d/toFinger.d, A); zoomMaal=cam.zoom;
  // vri: snu kameraet rundt midtpunktet
  let dv=v-toFinger.v; if(dv>Math.PI) dv-=2*Math.PI; if(dv<-Math.PI) dv+=2*Math.PI;
  if(A && Math.abs(dv)>0.0005){ const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), dv);   // innholdet følger fingrene
    const ot=controls.target.clone().sub(A).applyQuaternion(q), oc=cam.position.clone().sub(A).applyQuaternion(q);
    controls.target.copy(A).add(ot); cam.position.copy(A).add(oc); cam.lookAt(controls.target); }
  toFinger.flyttet+=Math.abs(Math.log(d/toFinger.d))*120+Math.hypot(m.x-toFinger.m.x,m.y-toFinger.m.y)+Math.abs(dv)*120;
  toFinger.d=d; toFinger.v=v; toFinger.m=m; });
function slipp(e){ if(!fingre.has(e.pointerId)) return; fingre.delete(e.pointerId);
  if(toFinger && fingre.size<2){ const kort_=performance.now()-toFinger.t0<260 && toFinger.flyttet<14; toFinger=null; down=null;
    if(kort_ && introDone){ clearTimeout(klikkTimer); const z=Math.max(1,cam.zoom/2.2); if(z<=1.01) flyTo(HOME.target,1); else flyTo(null, z, undefined, {anker:controls.target.clone(), e:easeUt, dur:520}); } } }
el.addEventListener('pointerup',slipp); el.addEventListener('pointercancel',slipp);
el.addEventListener('dblclick',e=>e.preventDefault());
function visHjem(){ const borte = Math.abs(Math.log(cam.zoom))>0.05 || controls.target.distanceTo(HOME.target)>8 || Math.abs(controls.getAzimuthalAngle()-HOME.az)>0.08; hjem.classList.toggle('vis', introDone && borte); }
kort.querySelector('.lukk').onclick=()=>{kort.classList.remove('vis'); if(valgt){valgt.userData.lift=false; valgt=null;}};
speil.size(); addEventListener('resize',()=>speil.size());
tick();

// Tjenestearbeider: kartet virker uten nett etter første besøk. Versjonen i navnet byttes av bygg.py, så ny versjon rydder gammel buffer.
const NAVN='gamlebyen-25';
const FILER=['./','index.html','data/by.json','assets/vann.png','assets/pensel.png',
 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js',
 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/shaders/FXAAShader.js'];
self.addEventListener('install',e=>{ e.waitUntil(caches.open(NAVN).then(c=>c.addAll(FILER)).then(()=>self.skipWaiting())); });
self.addEventListener('activate',e=>{ e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==NAVN).map(k=>caches.delete(k)))).then(()=>self.clients.claim())); });
self.addEventListener('fetch',e=>{ e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))); });

</script>
